ubadoras e aceleradoras em operação no Polo","hz":"C"},{"code":"3.7.1.2","text":"Até 2030, atender pelo menos 4.500 micro, pequenos e médios empreendedores, cooperativas e empreendimentos locais do Polo TEJ a linhas de crédito, assistência técnica e instrumentos de apoio à inovação e ao desenvolvimento produtivo, com orientação ao acesso ao crédito (900 por ano, 20 por município), dos quais pelo menos 50% com processo de atendimento concluído","hz":"C"},{"code":"3.7.1.3","text":"Até 2030, ter pelo menos 90.000 empresas e outras organizações em atividade no Polo (eram 74.950 em 2024 e 66.680 em 2022)","hz":"C"}]}]},{"cod":"3.3","og":"Distribuir as ações de diversificação econômica entre as associações de municípios","desc":"Direcionar os instrumentos de apoio à diversificação econômica de forma equilibrada, visando à redução das desigualdades internas e promovendo o crescimento de atividades econômicas e empregos formais, com foco no Polo PETEJ SC.","oes":[{"cod":"3.3.1","oe":"Promover a diversificação econômica nos municípios do Polo, de forma equilibrada entre as associações de municípios e com prioridade para os municípios com menor PIB per capita","metas":[{"code":"3.3.1.1","text":"Até 2030, realizar diagnóstico da matriz econômica e da concentração setorial dos 45 municípios do Polo (a ser concluído até o final do 1° ano de implementação do Plano), com a identificação dos 10 municípios de menor PIB per capita, prioritários para as ações de diversificação","hz":"C"},{"code":"3.3.1.2","text":"Até 2040, diversificar a matriz econômica de pelo menos 10 municípios do Polo com os menores PIB per capita, identificados na Meta 3.3.1.1","hz":"M"}]},{"cod":"3.3.2","oe":"Ampliar o acesso dos empreendedores e empreendimentos locais a crédito, assistência técnica, mercados, compras públicas, inovação e instrumentos de apoio ao desenvolvimento produtivo, para os municípios com menor PIB per capita","metas":[{"code":"3.3.2.1","text":"Até 2030, ampliar o acesso de micro, pequenas e médias empresas, cooperativas e empreendimentos locais do Polo TEJ a linhas de crédito, assistência técnica e instrumentos de apoio à inovação e ao desenvolvimento produtivo, nos municípios de menor PIB per capita, com condições adequadas às necessidades e capacidades dos diferentes perfis de empreendedores","hz":"C"}]},{"cod":"3.3.3","oe":"Fortalecer a articulação econômica dos municípios do Polo PETEJ SC no âmbito de cadeias produtivas regionais e estaduais, apoiando arranjos produtivos locais, regionais e interregionais","metas":[{"code":"3.3.3.1","text":"Até 2030, pactuar com os municípios do Polo uma estratégia regional de articulação econômica que identifique complementaridades produtivas, oportunidades de integração entre cadeias e formas de ampliar a participação de trabalhadores e empreendimentos locais nas atividades econômicas emergentes na transição.","hz":"C"},{"code":"3.3.3.2","text":"Até 2040, apoiar a estruturação ou o fortalecimento de arranjos produtivos locais ou regionais em setores prioritários, promovendo a cooperação entre municípios, empresas, cooperativas, instituições de ensino e demais atores, e facilitando o acesso de empreendimentos locais a mercados e oportunidades de trabalho decente.","hz":"M"}]}]},{"cod":"3.4","og":"Diversificar a pauta exportadora e os mercados de destino","desc":"Ampliar a presença dos produtos próximos às capacidades exportadoras do Estado, com foco no Polo PETEJ-SC, e diversificar os mercados de destino, por meio de promoção comercial, apoio às empresas exportadoras e acesso logístico.","oes":[{"cod":"3.4.1","oe":"Aumentar o número de municípios e empresas do Polo PETEJ-SC que exportam","metas":[{"code":"3.4.1.1","text":"Promover o crescimento anual, a partir do ano do plano, no número de empresas atendidas por programas de exportação, com foco em pequenas e médias empresas que ainda não exportam","hz":"C"},{"code":"3.4.1.2","text":"Até 2030, ter pelo menos 30 municípios exportando mais de US$ 1 milhão por ano (em 2025 eram 21 dos 45)","hz":"C"}]},{"cod":"3.4.2","oe":"Ampliar a variedade de produtos exportados pelo Polo PETEJ-SC","metas":[{"code":"3.4.2.1","text":"Até 2040, aumentar o número anual de empresas apoiadas na adequação ou na certificação de produtos para exportação","hz":"M"},{"code":"3.4.2.2","text":"Até 2030, ter pelo menos 80 produtos com mais de US$ 1 milhão exportados por ano (em 2025 eram 60; em 2015, 34)","hz":"C"}]},{"cod":"3.4.3","oe":"Ampliar o número de países que compram produtos do Polo PETEJ-SC","metas":[{"code":"3.4.3.1","text":"Até 2030, aumentar a participação de empresas ou órgãos governamentais em feiras ou missões comerciais internacionais, com pelo menos uma por ano em um novo mercado, a partir do primeiro ano","hz":"C"},{"code":"3.4.3.2","text":"Conseguir pelo menos 51 países comprando mais de US$ 1 milhão por ano até 2030 (nível de 2015), e pelo menos 60 até 2040 (em 2025 eram 47)","hz":"M"}]}]},{"cod":"3.5","og":"Compensar a perda de arrecadação dos municípios dependentes do carvão","desc":"Desenvolver soluções institucionais de compensação fiscal para os municípios potencialmente afetados no Polo PETEJ-SC.","oes":[{"cod":"3.5.1","oe":"Preservar a receita das prefeituras do Polo PETEJ-SC que dependem do carvão, condicionado à criação de um instrumento legal de compensação fiscal (estadual e/ou federal), fora do escopo deste eixo","metas":[{"code":"3.5.1.1","text":"Até 2030, estruturar mecanismo de compensação fiscal proposto em vigor nas 3 prefeituras a partir do ano 2, com 1 relatório anual da receita proveniente do carvão","hz":"C"},{"code":"3.5.1.2","text":"Receita corrente de Treviso, de Lauro Müller e de Capivari de Baixo igual ou superior, em cada um dos primeiros 10 anos de implementação do PETEJ-SC, à de 2025 corrigida pela inflação (em 2025: R$ 48,3 milhões, R$ 106,3 milhões e R$ 167,4 milhões)","hz":"M"}]},{"cod":"3.5.2","oe":"Aumentar a arrecadação de impostos e taxas das prefeituras do Polo PETEJ-SC que dependem do carvão","metas":[{"code":"3.5.2.1","text":"Até 2030, definir pelo menos 3 planos de recomposição de receitas concluídos até o ano 2, um por prefeitura, com revisão anual de cada plano","hz":"C"},{"code":"3.5.2.2","text":"Até 2040, garantir arrecadação de impostos e taxas de Treviso, Lauro Müller e Capivari de Baixo, com crescimento acima da inflação em cada um dos primeiros 10 anos de implementação do PETEJ-SC (em 2025: R$ 3,3 milhões, R$ 9,6 milhões e R$ 26,4 milhões)","hz":"M"}]},{"cod":"3.5.3","oe":"Fortalecer de planejamento fiscal dos municípios mais dependentes do carvão para manter serviços públicos essenciais durante a transição.","metas":[{"code":"3.5.3.1","text":"Até 2030, oferecer programa de apoio técnico aos municípios mais dependentes do carvão para a elaboração de planos de adaptação fiscal e diversificação de receitas, considerando a continuidade de serviços públicos essenciais e a capacidade local de apoiar iniciativas de desenvolvimento econômico e inclusão produtiva.","hz":"C"}]}]},{"cod":"3.6","og":"Estruturar o financiamento e os incentivos à diversificação econômica","desc":"(Descrição não preenchida na planilha.)","oes":[{"cod":"3.6.1","oe":"Ampliar o financiamento recebido por empresas e prefeituras do Polo PETEJ-SC","metas":[{"code":"3.6.1.1","text":"Até 2030, definir e operacionalizar pelo menos 20 projetos de transformação produtiva do Polo, a partir do ano 1, com foco na diversificação da matriz econômica e na redução de emissões de GEE, estruturados e apresentados a uma fonte de financiamento","hz":"C"},{"code":"3.6.1.2","text":"Até 2030, conseguir R$ 4 bilhões desembolsados pelo Banco Nacional de Desenvolvimento Econômico e Social (BNDES) a empresas, produtores rurais e prefeituras do Polo, próximo do nível de 2025 (foram R$ 3,6 bilhões de 2021 a 2025), condicionado à carteira de projetos da Meta 3.6.1.1, com acompanhamento dos desembolsos do Banco Regional de Desenvolvimento do Extremo Sul (BRDE), da Agência de Fomento do Estado de Santa Catarina (BADESC), do Fundo Clima e do Fundo Estadual de Transição Energética Justa (FETEJ-SC) no Polo a partir do ano 1","hz":"C"}]},{"cod":"3.6.2","oe":"Ampliar o número de empresas do Polo PETEJ-SC que diversificam a produção com incentivo fiscal, condicionado à criação de incentivo por meio de legislação estadual","metas":[{"code":"3.6.2.1","text":"Até 2030, desenvolver regulamentos de incentivos fiscais voltados a novas atividades","hz":"C"},{"code":"3.6.2.2","text":"Até 2030, ter pelo menos 30 empresas do Polo com produto ou atividade nova em operação, com apoio do incentivo","hz":"C"}]},{"cod":"3.6.3","oe":"Estabelecer, atrair e/ou incentivar investimentos públicos e privados em setores econômicos capazes de gerar oportunidades de trabalho decente para as populações do Polo TEJ.","metas":[{"code":"3.6.3.1","text":"Aprofundar o detalhamento da carteira de projetos e inicativas de diversificação econômica e divulgá-lo até o final 2º ano, considerando especificações sobre postos de trabalho, renda , modalidade de trabalho, periculosidade e insalubridade, especificações de vagas afirmativas e medidas previstas para ampliar o acesso de pessoas trabalhadoras afetadas pela transição e de grupos sub-representados.","hz":"C"},{"code":"3.6.3.2","text":"Até 2030, mobilizar e apoiar, conforme os instrumentos legais e orçamentários disponíveis, investimentos públicos e privados em pelo menos três setores prioritários para a diversificação produtiva do Polo TEJ, estimulando a articulação entre projetos, qualificação profissional e oportunidades de trabalho decente para as populações locais.","hz":"C"}]}]}]},{"n":4,"titulo":"Eixo 4 - Desenvolvimento de Infraestrutura","ogs":[{"cod":"4.1","og":"Integrar o Polo PETEJ-SC às redes de transporte e logística","desc":"Integrar as redes ferroviárias, portuárias e aeroportuárias da região para apoiar o desenvolvimento da base econômica existente e futura, com foco nos territórios com menor nível de conexão, contribuindo para a descarbonização.","oes":[{"cod":"4.1.1","oe":"Diversificar as cargas da Ferrovia Tereza Cristina, incluindo eventualmente o transporte de pessoas, e reduzir sua dependência do transporte de carvão mineral","metas":[{"code":"4.1.1.1","text":"Dobrar, até 2040, o volume anual de carga conteinerizada transportado pela ferrovia em relação ao ano base 2025","hz":"M"},{"code":"4.1.1.2","text":"Assinar, até 2030, o aditivo de prorrogação da concessão com o plano de investimentos previsto e executar ao menos 80% desse plano no prazo contratual","hz":"C"}]},{"cod":"4.1.2","oe":"Viabilizar a conexão da Ferrovia Tereza Cristina à malha ferroviária nacional, reduzindo os impactos sobre as comunidades atravessadas","metas":[{"code":"4.1.2.1","text":"Aprovar, antes do início das obras e até 2035, um plano de mitigação dos impactos sociais da ligação (desapropriações, reassentamentos e travessias urbanas), construído com consulta aos municípios e às comunidades atravessadas","hz":"M"},{"code":"4.1.2.2","text":"Concluir as obras e colocar a ligação ferroviária em operação até 2040","hz":"M"}]},{"cod":"4.1.3","oe":"Ampliar o uso do Porto de Imbituba e do Aeroporto de Jaguaruna pelas empresas e pela população do Polo PETEJ SC, em coerência com as metas climáticas nacionais","metas":[{"code":"4.1.3.1","text":"Dobrar, até 2040, a carga de cabotagem embarcada no Porto de Imbituba em relação a 2025","hz":"M"},{"code":"4.1.3.2","text":"Dobrar, até 2030, o número anual de passageiros do Aeroporto de Jaguaruna em relação a 2025","hz":"C"}]}]},{"cod":"4.2","og":"Superar os gargalos rodoviários","desc":"Superar os gargalos no sul catarinense relativos à BR-101 e à rede rodoviária em geral, em prol da eficiência e sustentabilidade da base produtiva existente e futura.","oes":[{"cod":"4.2.1","oe":"Eliminar os pontos críticos de acesso e de travessia urbana da BR-101 no Polo","metas":[{"code":"4.2.1.1","text":"Concluir, até 2040, obras em 100% dos pontos críticos de acesso e travessia urbana da BR-101 no Polo classificados como prioritários, com critério de prioridade baseado em acidentes e volume de tráfego","hz":"M"}]},{"cod":"4.2.2","oe":"Estruturar \"corredores verdes\" para veículos pesados à biometano e veiculos elétricos","metas":[{"code":"4.2.2.1","text":"Implantar, até 2030, pelo menos 3 postos de abastecimento de biometano para veículos pesados ao longo da BR-101 no Polo, um em cada associação de municípios (AMREC, AMESC, AMUREL)","hz":"C"},{"code":"4.2.2.2","text":"Quadruplicar os pontos de recarga elétrica na malha rodoviária do Polo PETEJ SC, até 2030","hz":"C"}]}]},{"cod":"4.3","og":"Estruturar a conectividade digital","desc":"Estruturar a infraestrutura de conectividade para viabilizar serviços digitais e a digitalização da economia existente e futura, de forma sustentável.","oes":[{"cod":"4.3.1","oe":"Garantir a cobertura 5G e ampliar a conexão por fibra óptica nos municípios do Polo PETEJ SC","metas":[{"code":"4.3.1.1","text":"Garantir cobertura 5G na sede dos 45 municípios do Polo até 2040, alcançando ao menos 80% da população do Polo","hz":"M"},{"code":"4.3.1.2","text":"Conectar por fibra óptica, até 2040, ao menos 50% das escolas públicas e 50% das unidades básicas de saúde do Polo","hz":"M"}]},{"cod":"4.3.2","oe":"Implantar a infraestrutura digital e elétrica para centros de dados no Polo","metas":[{"code":"4.3.2.1","text":"Colocar em operação, até 2040, um ramal de fibra óptica de alta capacidade ligando o Polo à estação de cabo submarino mais próxima","hz":"M"},{"code":"4.3.2.2","text":"Disponibilizar, até 2030, ao menos 50 MW de potência para conexão de centros de dados em subestação do Polo, com parecer de acesso emitido","hz":"C"}]}]},{"cod":"4.4","og":"Promover a equidade territorial no acesso à infraestrutura","desc":"Promover o acesso às redes de infraestrutura de logística e digital para todos os municípios do Polo PETEJ-SC para que o desenvolvimento econômico e social alcance todo o território de forma equitativa.","oes":[{"cod":"4.4.1","oe":"Conectar à rede troncal os municípios do Polo hoje sem acesso ferroviário, portuário ou rodoviário troncal","metas":[{"code":"4.4.1.1","text":"Pavimentar ou requalificar a ligação rodoviária à BR-101 ou à ferrovia de ao menos 5 dos 22 municípios hoje sem acesso troncal, até 2035, e de ao menos 10 dos 22 municípios, até 2040, incluindo a implantação de 2 ramais ou pátios de acesso à ferrovia para arranjos produtivos sem acesso troncal","hz":"M"}]},{"cod":"4.4.2","oe":"Direcionar aos municípios do Polo sem acesso troncal uma parcela do investimento em infraestrutura do Plano maior que o seu peso atual no emprego","metas":[{"code":"4.4.2.1","text":"Alocar ao menos 28,5% do valor da carteira de infraestrutura do Plano nos 22 municípios sem acesso troncal até 2040, proporcional ao seu peso nos vínculos das apostas seguras para a diversificação produtiva (28,5%) e acima dos 20,4% do emprego formal do Polo que eles concentram hoje","hz":"M"}]},{"cod":"4.4.3","oe":"Priorizar investimentos em infraestrutura nos municípios mais dependentes do carvão","metas":[{"code":"4.4.3.1","text":"Contratar ao menos 1 projeto de infraestrutura em cada um dos municípios de Capivari de Baixo, Lauro Müller e Treviso até 2040","hz":"M"}]}]},{"cod":"4.5","og":"Alavancar recursos necessários para o desenvolvimento de infraestrutura","desc":"Desenvolver projetos bancáveis para que o financiamento público e privado seja canalizado para o desenvolvimento necessário de infraestruturas no território.","oes":[{"cod":"4.5.1","oe":"Estruturar uma carteira de projetos de infraestrutura bancáveis para o Polo","metas":[{"code":"4.5.1.1","text":"Concluir estudos de viabilidade (EVTEA) para todos os projetos de infraestrutura classificados como prioridade Alta ou Muito Alta na carteira do Plano até 2030","hz":"C"}]},{"cod":"4.5.2","oe":"Mobilizar financiamento público e privado para o sistema de infraestrutura do Polo","metas":[{"code":"4.5.2.1","text":"Contratar, até 2040, o financiamento de ao menos metade dos projetos de infraestrutura prioritários (prioridade Alta ou Muito Alta, Anexo II), considerando fontes públicas e privadas (concessões, PPPs, investimento direto)","hz":"M"},{"code":"4.5.2.2","text":"Estruturar ao menos 1 nova concessão ou PPP de infraestrutura no Polo até 2030","hz":"C"}]}]}]},{"n":5,"titulo":"Eixo 5 - Social, Bem-estar, Trabalho, Emprego e Renda","ogs":[{"cod":"5.1","og":"Proteger os direitos das pessoas trabalhadoras","desc":"Garantir a proteção dos direitos das pessoas trabalhadoras durante todo o processo de transformação da cadeia carbonífera","oes":[{"cod":"5.1.1","oe":"Articular órgãos estaduais, municípios e entidades representativas das pessoas trabalhadoras e demais instituições para prevenir situações de desemprego, precarização e perda de direitos no contexto da transição.","metas":[{"code":"5.1.1.1","text":"Até 2040, formalizar acordos de cooperação técnica com os municípios do Polo TEJ para apoio nas capacidades estatais.","hz":"M"},{"code":"5.1.1.2","text":"Até 2030, criar e publicar protocolo de comunicação antecipada de demissões coletivas, reestruturações e encerramento de atividades, com definição de responsáveis, dos prazos de comunicação e das informações a serem fornecidas.","hz":"C"},{"code":"5.1.1.3","text":"Até 2030, estabelecer fluxos interinstitucionais de atendimento e encaminhamento das pessoas trabalhadoras afetadas, envolvendo órgãos estaduais, municípios e demais instituições pertinentes.","hz":"C"}]},{"cod":"5.1.2","oe":"Criar mecanismos estaduais de identificação e de acompanhamento dos impactos da transição sobre emprego, renda, condições de trabalho e proteção social.","metas":[{"code":"5.1.2.1","text":"Até 2030, concluir o mapeamento das pessoas trabalhadoras direta e indiretamente vinculadas à cadeia carbonífera no Polo TEJ, identificando aquelas potencialmente afetadas pela transição.","hz":"C"},{"code":"5.1.2.2","text":"Criar, até 2030, o cadastro estadual de trabalhadores impactados, em conformidade com a LGPD e com a coleta de dados sobre impactos, emprego, renda e condições de trabalho e procedimentos de atualização.","hz":"C"},{"code":"5.1.2.3","text":"Construir um observatório público com os resultados desagregados do mapeamento das pessoas trabalhadoras afetadas por gênero, raça, território, idade e educação, com painel público de indicadores (emprego, renda, condições de trabalho e proteção social), até 2040.","hz":"M"}]},{"cod":"5.1.3","oe":"Ampliar o acesso das pessoas trabalhadoras a serviços públicos de orientação profissional, trabalhista, previdenciária e de proteção social, com atenção prioritária a grupos em situação de vulnerabilidade.","metas":[{"code":"5.1.3.1","text":"Ampliar em 75%, até 2040 em relação a 2030, o número de pessoas trabalhadoras atendidas por serviços públicos de orientação profissional, trabalhista, previdenciária e de proteção social nos municípios do Polo TEJ.","hz":"M"},{"code":"5.1.3.2","text":"Até 2040 capacitar 100% dos profissionais envolvidos nos serviços para atendimento humanizado e adequado às necessidades de grupos vulneráveis.","hz":"M"},{"code":"5.1.3.3","text":"Até 2050, desenvolver ações específicas de busca ativa e orientação para mulheres, população negra, pessoas com deficiência, população LGBTQIA+, jovens, pessoas idosas, migrantes e trabalhadores informais, conforme as características do território, registrando públicos alcançados e encaminhamentos realizados.","hz":"L"},{"code":"5.1.3.4","text":"Até 2040, criar ou ampliar pontos de atendimento presencial e/ou itinerante em territórios com maior concentração de trabalhadores em situação de vulnerabilidade.","hz":"M"}]},{"cod":"5.1.4","oe":"Articular órgãos estaduais, agências reguladoras, municípios e entidades representativas para acompanhamento dos efeitos da transição energética na saúde mental e outros riscos ocupacionais das pessoas trabalhadoras afetadas e suas famílias.","metas":[{"code":"5.1.4.1","text":"Até 2050, articular e encaminhar para órgãos municipais 100% da demanda em riscos ocupacionais registradas pelas das pessoas trabalhadoras cadastradas por meio dos centros de referência em saúde do trabalhador.","hz":"L"},{"code":"5.1.4.2","text":"Até 2040, articular e encaminhar para órgãos municipais 100% da demanda em saúde das pessoas cadastradas por meio da atenção básica.","hz":"M"},{"code":"5.1.4.3","text":"Até 2030, criar um mecanismo de monitoramento de doenças e acidentes ocupacionais e segurança estrutural durante o período da transição em parceria com a vigilância sanitária, superintendência regional do trabalho e a Agência Nacional de Mineração e outros órgãos competentes; com publicação anual de resultados.","hz":"C"}]}]},{"cod":"5.2","og":"Promover requalificação e recolocação profissinal","desc":"Promover, sem discriminação, a recolocação profissional para as pessoas trabalhadoras do setor carbonífero que assegure sua inserção em oportunidades de trabalho decente, com preservação da renda e valorização das competências e identidades profissionais","oes":[{"cod":"5.2.1","oe":"Estruturar uma estratégia estadual de requalificação, transição laboral e recolocação profissional, sem discriminação, para as pessoas trabalhadoras afetadas pela transformação da cadeia carbonífera.","metas":[{"code":"5.2.1.1","text":"Instituir, até 2030, um programa estadual de requalificação, transição laboral e recolocação profissional para as pessoas trabalhadoras afetadas pela transformação da cadeia carbonífera com critérios de não discriminação e atenção às pessoas que enfrentam maiores dificuldades de recolocação.","hz":"C"},{"code":"5.2.1.2","text":"Assegurar, até 2040, o acesso a serviços especializados de orientação profissional e intermediação de mão de obra a pelo menos 80% das pessoas trabalhadoras afetadas cadastradas no programa estadual, por meio do fortalecimento do SINE e de outros serviços públicos de emprego nos territórios afetados","hz":"M"},{"code":"5.2.1.3","text":"Alcançar, até 2050, a inserção em oportunidades de trabalho decente das pessoas trabalhadoras desligadas que aderirem ao programa estadual, com acompanhamento da remuneração, das condições de trabalho e da permanência no emprego por, pelo menos, 12 meses.","hz":"L"}]},{"cod":"5.2.2","oe":"Integrar políticas estaduais de emprego, qualificação profissional, educação, desenvolvimento econômico e proteção social para ampliar as oportunidades de trabalho decente.","metas":[{"code":"5.2.2.1","text":"Instituir, até 2040, mecanismos de coordenação intersetorial e de cooperação federativa para integrar políticas, programas e serviços estaduais de emprego e renda, qualificação profissional, educação, desenvolvimento econômico e proteção social às diretrizes e aos instrumentos nacionais pertinentes, priorizando as pessoas trabalhadoras e os territórios do Polo TEJ e a ampliação de oportunidades de trabalho decente; com responsabilidades definidas e registro de reuniões e decisões.","hz":"M"}]},{"cod":"5.2.3","oe":"Mapear competências profissionais e identificar oportunidades de inserção dos trabalhadores em setores econômicos existentes ou emergentes nos territórios afetados.","metas":[{"code":"5.2.3.1","text":"Concluir, até 2030, diagnóstico sobre as competências, experiências profissionais, interesses e necessidades de qualificação das pessoas cadastradas no cadastro estadual de trabalhadores afetados pela transição [metas 5.1.2.1 e 5.1.2.1].","hz":"C"},{"code":"5.2.3.3","text":"Concluir, até 2030, o mapeamento das oportunidades de trabalho e das competências demandadas por setores econômicos existentes ou emergentes nos territórios do Polo TEJ, identificando possibilidades de aproveitamento das competências e experiências profissionais das pessoas trabalhadoras do setor carbonífero.","hz":"C"},{"code":"5.2.3.4","text":"Assegurar, até 2040, o acesso das pessoas trabalhadoras cadastradas a informações e serviços de orientação profissional que relacionem suas competências e interesses às oportunidades de emprego e qualificação disponíveis nos territórios do Polo TEJ.","hz":"M"}]},{"cod":"5.2.4","oe":"Priorizar pessoas trabalhadoras afetadas pela transição em programas estaduais de qualificação profissional, empreendedorismo e desenvolvimento produtivo, mediante critérios públicos de priorização, com atenção a quem enfrenta maior dificuldade de recolocação.","metas":[{"code":"5.2.4.1","text":"Estabelecer, até 2030, critérios públicos e transparentes de priorização das pessoas trabalhadoras afetadas pela transição nos programas estaduais de qualificação profissional, empreendedorismo e desenvolvimento produtivo, considerando situações de vulnerabilidade e dificuldades de recolocação profissional.","hz":"C"},{"code":"5.2.4.2","text":"Assegurar, até 2040, a inclusão de mecanismos de atendimento prioritário às pessoas trabalhadoras afetadas pela transição nos programas estaduais de apoio ao empreendedorismo e ao desenvolvimento produtivo, com atenção especial àquelas que enfrentam maiores dificuldades de recolocação profissional.","hz":"M"}]},{"cod":"5.2.5","oe":"Articular programas estaduais, municipais e federais de apoio à manutenção da renda durante os processos de qualificação e recolocação.","metas":[{"code":"5.2.5.1","text":"Estabelecer, até 2040, acordos de cooperação com municípios e governo federal para articulação entre programas e políticas de requalificação e recolocação profissional para pessoas trabalhadoras da cadeia carbonífera afetadas pelo processo de transição.","hz":"M"},{"code":"5.2.5.2","text":"Realizar, até 2050, campanhas de conscientização e oferta de orientação individualizada sobre direitos trabalhistas, previdenciários e benefícios de proteção social para 100% das pessoas trabalhadoras cadastradas no programa estadual de transição laboral, registrando anualmente a oferta, a procura e os encaminhamentos.","hz":"L"},{"code":"5.2.5.3","text":"Firmar, até 2040, acordo de cooperação com o SEBRAE para a estruturação e implementação de programas de fomento ao empreendedorismo nos municípios do Polo TEJ, com público-alvo, plano de trabalho e indicadores de acompanhamento por programa.","hz":"M"}]}]},{"cod":"5.3","og":"Promover a reparação dos passivos socioambientais da cadeia carbonífera como vetor de geração de trabalho decente e renda","desc":"Promover a reparação dos passivos socioambientais da cadeia carbonífera, assegurando processos de fechamento, descomissionamento e recuperação territorial responsáveis, justos e transparentes, com capacidade de converter a recuperação ambiental em vetor de geração de trabalho decente e renda","oes":[{"cod":"5.3.1","oe":"Identificar, sistematizar e dar transparência aos passivos ambientais da mineração no Polo TEJ.","metas":[{"code":"5.3.1.1","text":"Até 2040, publicar relatório de dados georreferenciado dos passivos da mineração de carvão no Polo TEJ, com responsáveis, obrigação judicial existente, população exposta e estágio de reparação preenchidos para 100% dos passivos constantes das ACPs do Carvão e da Segurança Estrutural e dos relatórios do GTA.","hz":"M"},{"code":"5.3.1.2","text":"Desde sua publcação até 2050, disponibilzar anualmente o relatório de dados ao público, em formato aberto, georreferenciado e em linguagem acessível.","hz":"L"}]},{"cod":"5.3.2","oe":"Estabelecer diretrizes estaduais para processos de fechamento e descomissionamento socialmente responsáveis e transparentes, com atenção às normas e regulamentações federais.","metas":[{"code":"5.3.2.1","text":"Até 2040, aprovar e publicar, após consulta pública, diretriz estadual com requisitos sociais mínimos para fechamento e descomissionamento, contemplando comunicação antecipada a trabalhadores e municípios, plano laboral negociado com os sindicatos, participação das comunidades, transparência e monitoramento pós-fechamento.","hz":"M"},{"code":"5.3.2.2","text":"A partir da aprovação da diretriz e até 2050, aplicá-la em 100% dos processos de licenciamento ambiental de fechamento e descomissionamento de áreas de mineração de carvão e do Complexo Termelétrico Jorge Lacerda conduzidos pelo IMA e iniciados após a aprovação da diretriz, e nos projetos apoiados pelo PETEJ que envolvam fechamento ou descomissionamento.","hz":"L"}]},{"cod":"5.3.3","oe":"Criar mecanismos de monitoramento para garantir que os processos de recuperação e reperação ambiental no Polo TEJ incorporem padrões de trabalho decente.","metas":[{"code":"5.3.3.1","text":"Até 2030, definir e publicar padrões mínimos de trabalho decente (contratação formal, saúde e segurança ocupacional, remuneração, jornada, não discriminação e prevenção ao assédio) e incorporá-los a 100% dos instrumentos dos projetos de recuperação apoiados pelo PETEJ firmados a partir da publicação.","hz":"C"},{"code":"5.3.3.2","text":"Até 2050, realizar ao menos uma verificação por ano em 100% dos projetos de recuperação em execução e encaminhar 100% das não conformidades classificadas como críticas, conforme critérios publicados, ao TRF-4, ao MPF, ao MTE, ao MPT ou ao órgão competente em até 30 dias.","hz":"L"}]},{"cod":"5.3.4","oe":"Priorizar a contratação e a formação de pessoas trabalhadoras locais, com atenção às egressas da cadeia carbonífera, nas atividades de recuperação e reparação ambiental e de reconversão territorial no Polo TEJ.","metas":[{"code":"5.3.4.1","text":"Até 2040, pactuar, no âmbito do GTA, protocolo de compromisso com as empresas responsáveis para a contratação local e o trabalho decente nas obras de recuperação ambiental, com atenção a trabalhadores da cadeia carbonífera e à mulheres durante o processo de transição, com adesão de ao menos 80% das empresas responsáveis convidadas e aderentes.","hz":"M"},{"code":"5.3.4.2","text":"Até 2040, em 100% dos projetos de recuperação apoiados pelo PETEJ, garantir a priorização da contratação de pessoas residentes nos municípios do Polo TEJ, de modo que residentes ocupem ao menos 50% das vagas contratadas, em especial egressos da cadeia carbonífera e em situação de vulnerabilidade.","hz":"M"},{"code":"5.3.4.3","text":"Até 2050, ofertar formação gratuita e certificada, com reconhecimento de saberes prévios, para as ocupações demandadas pelos projetos de recuperação (solo, água, restauração ecológica, segurança de áreas e monitoramento), a 100% das pessoas locais selecionadas que necessitem dela, antes do início de sua atuação, em especial egressos da cadeia carbonífera e em situação de vulnerabilidade.","hz":"L"}]},{"cod":"5.3.5","oe":"Incentivar cadeias produtivas, empreendimentos e atividades econômicas sustentáveis vinculadas à recuperação dos territórios afetados pela mineração no Polo TEJ.","metas":[{"code":"5.3.5.1","text":"Até 2040, estruturar, com BRDE, BADESC e FETEJ-SC, ao menos uma linha de financiamento ou instrumento de incentivo para empreendimentos vinculados à recuperação dos territórios afetados pela mineração, priorizando micro e pequenas empresas, cooperativas e iniciativas locais.","hz":"M"},{"code":"5.3.5.2","text":"Até 2050, a partir do mapeamento das iniciativas de diversificação ligadas à recuperação já estudadas por órgãos e empresas do GTA, selecionar e apoiar ao menos uma cadeia, empreendimento ou arranjo vinculado à recuperação, subordinados aos parâmetros técnicos que o GTA homologar, com critérios de seleção que verifiquem se o apoio público é necessário, se gera trabalho e renda novos no território e se assegura a sustentabilidade socioambiental, sem substituir obrigações das empresas responsáveis.","hz":"L"}]},{"cod":"5.3.6","oe":"Estabelecer mecanismos de monitoramento público, com participação das comunidades, dos compromissos, recursos, cronogramas e resultados dos processos de reparação e recuperação ambiental dos passivos da mineração no Polo TEJ.","metas":[{"code":"5.3.6.1","text":"Até 2040, publicar painel público de monitoramento dos processos de reparação e recuperação dos passivos da mineração no Polo TEJ, em linguagem acessível, com compromissos, responsáveis, recursos, cronogramas, resultados, indicadores, relatórios do GTA e andamento das obrigações das duas ACPs, e atualizá-lo ao menos uma vez por ano.","hz":"M"},{"code":"5.3.6.2","text":"Até 2050, realizar ao menos uma rodada anual de prestação de contas em cada município do Polo TEJ com passivos da mineração, publicando síntese das questões levantadas e dos encaminhamentos.","hz":"L"}]}]},{"cod":"5.4","og":"Reduzir desigualdades e promover acesso à espaços decisórios","desc":"Reduzir desigualdades estruturais e assegurar o acesso equitativo de grupos historicamente excluídos às oportunidades, aos benefícios e aos espaços decisórios da transição","oes":[{"cod":"5.4.1","oe":"Identificar os impactos diferenciados da transição sobre mulheres, população negra, povos e comunidades tradicionais, migrantes, pessoas com deficiência, crianças, jovens, pessoas idosas e outros grupos em situação de vulnerabilidade.","metas":[{"code":"5.4.1.1","text":"Até 2030, realizar um estudo, com base no cadastro das pessoas trabalhadoras [metas 5.1.2.1 e 5.1.2.2], sobre os impactos diferenciados da transição nos grupos prioritários definidos no plano, contemplando mulheres, população negra, povos e comunidades tradicionais, migrantes, pessoas com deficiência, crianças, jovens e pessoas idosas, com atualização a cada 2 anos.","hz":"C"},{"code":"5.4.1.2","text":"Até 2030, mapear os povos e comunidades tradicionais potencialmente afetados e titulares do direito à consulta nos municípios do Polo TEJ, com registro público dos resultados.","hz":"C"}]},{"cod":"5.4.2","oe":"Garantir a equidade e participação de pessoas atingidas pela transição energética","metas":[{"code":"5.4.2.1","text":"Estabelecer até 2030 critérios públicos e transparentes de priorização das pessoas trabalhadoras afetadas pela transição programa estadual de requalificação, transição laboral e recolocação profissional (objetivo específico 5.2.1), considerando situações de vulnerabilidade e dificuldades de recolocação profissional.","hz":"C"},{"code":"5.4.2.2","text":"Até 2040, garantir que os critérios de equidade incluam pelo menos uma medida de ação afirmativa em 75% dos programas estaduais de requalificação e recolocação profissional criados a partir do processo de transição energética, divulgando anulamente o universo e a proporção alcançada.","hz":"M"},{"code":"5.4.2.3","text":"Até 2030, garantir que pelo menos 30% das vagas nas instâncias de governança do PETEJ sejam ocupadas por representantes de grupos historicamente excluídos.","hz":"C"}]},{"cod":"5.4.3","oe":"Reduzir progressivamente as barreiras ao programa estadual de requalificação e recolocação profissional (objetivo específico 2.1), inclusive as econômicas, territoriais, institucionais, informacionais e de acessibilidade.","metas":[{"code":"5.4.3.1","text":"Até 2030, identificar e mapear as principais barreiras econômicas, territoriais, institucionais, informacionais e de acessibilidade ao programa estadual de requalificação e recolocação profissional [meta 5.2.1.1], com plano de medidas para enfrentá-las.","hz":"C"},{"code":"5.4.3.2","text":"Até 2040, em relação a 2030 ampliar em 40% o número de atendimentos realizados por canais acessíveis, presenciais, digitais ou itinerantes (como Ouvidoria, postos de atendimento etc.).","hz":"M"},{"code":"5.4.3.3","text":"A partir de 2030, garantir condições de transporte e acesssibilidade em 100% para o programa estadual de requalificação e recolocação profissional [meta 5.2.1.1]","hz":"C"}]},{"cod":"5.4.4","oe":"Produzir e utilizar dados desagregados por gênero, raça/cor, nacionalidade, idade, deficiência, território e outros marcadores relevantes para monitorar desigualdades e orientar políticas, programas e iniciativas de transição.","metas":[{"code":"5.4.4.1","text":"Até 2040, 100% dos programas e projetos de transição com recursos estaduais coletarem e reportarem dados desagregados.","hz":"M"},{"code":"5.4.4.2","text":"Criar, até 2030, painel público estadual de transição justa, com indicadores desagregados por gênero, raça/cor, etc., município e região, atualizado ao menos anualmente (que poderá funcionar como uma página do dashboard previsto na meta 5.1.2.3)","hz":"C"}]},{"cod":"5.4.5","oe":"Promover condições de acesso, permanência e segurança no trabalho para mulheres nas oportunidades associadas ao processo de transição, em articulação com políticas de cuidado.","metas":[{"code":"5.4.5.1","text":"Até 2040, alcançar participação de ao menos 50% de mulheres nas vagas de qualificação e nos empregos da transição financiados ou apoiados pelo estado (com participação proporcional de mulheres negras, indígenas e com deficiência).","hz":"M"},{"code":"5.4.5.2","text":"Até 2030, criar e publicar protocolos de prevenção e combate ao assédio e à violência de gênero.","hz":"C"},{"code":"5.4.5.3","text":"Até 2040, assegurar que 100% das empresas com concessão estadual relacionadas aos projetos de transição disponham de canal de denúncia acessível e protocoo de encaminhamento de casos de assédio e violência de gênero.","hz":"M"},{"code":"5.4.5.4","text":"Até 2050, articular e encaminhar 100% da demanda de vagas de creche, educação em tempo integral e cuidado de dependentes, em articulação com os municípios, nos territórios de transição, registrando encaminhamentos e respostas dos serviços competentes.","hz":"L"},{"code":"5.4.5.5","text":"Até 2040, criar auxílio-cuidado estadual vinculado à qualificação profissional de mulheres em territórios de transição.","hz":"M"}]}]},{"cod":"5.5","og":"Garantir participação social e transparência","desc":"Assegurar a participação social e o acesso a informações acessíveis, claras e tempestivas às comunidades sobre o processo de transição","oes":[{"cod":"5.5.1","oe":"Estabelecer mecanismos permanentes de participação social na formulação, implementação e monitoramento da estratégia estadual de transição justa.","metas":[{"code":"5.5.1.1","text":"Até 2030, instituir a Câmara Social Permanente do PETEJ, vinculada ao Comitê Técnico ou ao Comitê Administrativo do Polo, com regimento aprovado, calendário anual publicado e representação equilibrada de trabalhadores, municípios, grupos vulnerabilizados, empresas, academia e sociedade civil.","hz":"C"},{"code":"5.5.1.2","text":"Da instalação da Câmara Social até 2050, realizar ao menos duas rodadas anuais de participação em cada território prioritário definido pela Câmara, registrando 100% das contribuições e publicando devolutiva sobre como foram consideradas.","hz":"L"},{"code":"5.5.1.3","text":"Publicar o primeiro relatório de acompanhamento do PETEJ até 2030 e, depois, um a cada dois anos até 2050, em linguagem acessível, com consulta pública e registro público de como as contribuições foram consideradas.","hz":"L"}]},{"cod":"5.5.2","oe":"Garantir transparência ativa sobre políticas, investimentos, fontes de financiamento, projetos, impactos, passivos, cronogramas, responsabilidades institucionais e resultados relacionados à transição.","metas":[{"code":"5.5.2.1","text":"Até 2030, publicar o portal público do PETEJ, em linguagem simples e formatos acessíveis, com cronograma, decisões, projetos, orçamento e fontes de financiamento, indicadores, mapas, passivos, responsabilidades institucionais e documentos, e com seção sobre os relatórios do GTA e o andamento das duas ACPs, integrada ao painel da meta 5.1.2.3.","hz":"C"},{"code":"5.5.2.2","text":"Entre 2031 e 2050, manter o portal em operação e atualizar suas informações anualmente.","hz":"L"}]},{"cod":"5.5.3","oe":"Promover estratégias de comunicação pública acessíveis e territorializadas sobre o processo de transição.","metas":[{"code":"5.5.3.1","text":"Até 2040, aprovar estratégia de comunicação pública territorializada, com plano local em cada município do Polo TEJ, uso de canais locais (rádios comunitárias, associações, sindicatos, escolas, unidades de saúde e CRAS) e materiais em linguagem simples e formatos acessíveis (Libras, leitura fácil, áudio e impresso).","hz":"M"},{"code":"5.5.3.2","text":"Até 2050, divulgar anualmente, nos canais locais dos municípios do Polo TEJ, os resultados dos relatórios do GTA e o andamento da recuperação ambiental em cada município.","hz":"L"}]},{"cod":"5.5.4","oe":"Criar canais permanentes para recebimento, encaminhamento e resposta, com prazos claros, às demandas e sugestões das comunidades e das pessoas trabalhadoras afetadas.","metas":[{"code":"5.5.4.1","text":"Até 2030, publicar portaria conjunta ou outro instrumento normativo cabível que assegure que a Ouvidoria-Geral do Estado encaminhe 100% das denúncias, reclamações, solicitações e sugestões de pessoas trabalhadoras, famílias e comunidades afetadas pelo encerramento ou modificação das atividades da cadeia carbonífera no Polo TEJ aos órgãos competentes (trabalho, saúde, assistência social e meio ambiente) em até 10 dias úteis, com fluxo de retorno à Ouvidoria.","hz":"C"},{"code":"5.5.4.2","text":"Da vigência do instrumento da meta 5.5.4.1 até 2050, assegurar que a Ouvidoria-Geral do Estado encaminhe 100% das manifestações em até 10 dias úteis e dê resposta inicial a 100% delas em até 30 dias, e que os órgãos de encaminhamento respondam à Ouvidoria em até 45 dias após o recebimento.","hz":"L"}]},{"cod":"5.5.5","oe":"Fortalecer a capacidade de organizações da sociedade civil, comunidades e entidades representativas para participar dos processos de decisão e monitoramento da transição.","metas":[{"code":"5.5.5.1","text":"Realizar, até 2030, diagnóstico participativo das capacidades das organizações da sociedade civil, comunidades, sindicatos e entidades representativas do Polo TEJ e das barreiras à participação (informação, tempo, deslocamento, cuidado e conectividade).","hz":"C"},{"code":"5.5.5.2","text":"Até 2040, ofertar formação e apoio (assessoria técnica, materiais e deslocamento) a ao menos 70% das organizações da sociedade civil, comunidades, sindicatos e entidades representativas do Polo TEJ mapeadas no diagnóstico participativo de capacidades.","hz":"M"},{"code":"5.5.5.2","text":"Até 2050, assegurar condições de participação (transporte, alimentação, acessibilidade e horários compatíveis com turnos de trabalho) em 100% dos encontros presenciais promovidos pelo PETEJ.","hz":"L"}]}]},{"cod":"5.6","og":"Garantir que o processo de diversificação econômica seja inclusivo","desc":"Promover a inclusão produtiva e o acesso equitativo às oportunidades de emprego e renda, considerando as vocações locais, as competências das pessoas trabalhadoras e os grupos em situação de vulnerabilidade.","oes":[{"cod":"5.6.1","oe":"Fortalecer instrumentos para que a diversifiação econômica seja inclusiva, considerando as vocações locais, as competências profissionais das pessoas trabalhadoras afetadas pela transição e as oportunidades de trabalho decente.","metas":[{"code":"5.6.1.1","text":"Concluir e publicar, até 2030, diagnóstico das potencialidades econômicas e vocações produtivas dos municípios do Polo TEJ, identificando oportunidades de inclusão produtiva e inserção em trabalho decente, considerando as competências profissionais das pessoas trabalhadoras afetadas cadastradas e as barreiras de acesso às oportunidades de emprego e geração de renda.","hz":"C"},{"code":"5.6.1.2","text":"Elaborar, até 2040, planos de inclusão produtiva para os municípios do Polo TEJ, com ações para conectar pessoas trabalhadoras às vagas de emprego disponíveis ou futuras, aos mercados e às iniciativas de geração de renda, com participação social.","hz":"M"}]},{"cod":"5.6.2","oe":"Apoiar o desenvolvimento e a competitividade de micro, pequenas e médias empresas, cooperativas, empreendimentos da economia solidária e iniciativas de base local nos territórios em transição.","metas":[{"code":"5.6.2.1","text":"Ampliar em 75%, até 2040, em relação a 2030, a cobertura de programas de fortalecimento da gestão, produtividade, inovação e competitividade de micro, pequenas e médias empresas, cooperativas, empreendimentos da economia solidária e iniciativas de base local nos municípios do Polo TEJ.","hz":"M"},{"code":"5.6.2.2","text":"Apoiar, até 2050, a criação, formalização ou expansão de empreendimentos locais em setores econômicos prioritários para a diversificação produtiva, com atenção às iniciativas lideradas por mulheres, jovens, pessoas trabalhadoras da cadeia carbonífera afetadas pela transição e outros grupos em situação de vulnerabilidade.","hz":"L"}]},{"cod":"5.6.3","oe":"Integrar políticas estaduais de desenvolvimento econômico, inovação, ciência e tecnologia, infraestrutura, qualificação profissional e sustentabilidade para apoiar a diversificação das economias locais.","metas":[{"code":"5.6.3.1","text":"Estabelecer, até 2040, mecanismos de articulação entre políticas estaduais de desenvolvimento econômico, inovação, ciência e tecnologia, infraestrutura, qualificação profissional e sustentabilidade, com definição de prioridades e responsabilidades para apoiar a diversificação econômica do Polo TEJ.","hz":"M"},{"code":"5.6.3.2","text":"Implementar, até 2050, pelo menos três iniciativas intersetoriais de apoio à diversificação econômica do Polo TEJ, articulando investimentos em infraestrutura, inovação, qualificação profissional e desenvolvimento produtivo sustentável, publicando, para cada iniciativa, público beneficiário, recursos, cronomana e resultados relacionados ao emprego e renda.","hz":"L"}]},{"cod":"5.6.4","oe":"Estabelecer mecanismos de acompanhamento dos resultados da diversificação econômica, considerando geração de emprego e renda, inclusão social, sustentabilidade ambiental e redução da dependência da cadeia carbonífera no Polo TEJ.","metas":[{"code":"5.6.4.1","text":"Instituir, até 2040, um sistema de monitoramento da diversificação econômica do Polo TEJ com indicadores de emprego e renda, qualidade das ocupações, acesso e conclusão de ações de qualificação, inserção profissional de pessoas trabalhadoras afetadas pela transição, inclusão de grupos sub-representados e desempenho dos empreendimentos locais.","hz":"M"},{"code":"5.6.4.2","text":"Publicar, até 2050, relatórios anuais sobre os resultados da diversificação econômica e da inclusão produtiva, com dados desagregados por município, setor e grupo populacional sempre que disponíveis, observadas as regras de proteção de dados, e com participação social na avaliação.","hz":"L"}]}]}]},{"n":6,"titulo":"Eixo 6 - Ciência, Tecnologia e Inovação","ogs":[{"cod":"6.1","og":"Fortalecer o sistema regional de inovação do Polo PETEJ-SC","desc":"Fortalecer o sistema regional de inovação, promovendo a cooperação entre universidades, centros tecnológicos e de inovação, o setor produtivo, as instituições públicas e a sociedade civil, e difundindo as capacidades de inovação no território.","oes":[{"cod":"6.1.1","oe":"Promover a construção de uma rede de cooperação estadual de inovação para a TEJ no Estado de Santa Catarina, alavancando o potencial existente das diferentes instituições dedicadas à inovação tecnológica","metas":[{"code":"6.1.1.1","text":"Até 2030 conceber, criar e operacionalizar a rede de cooperação estadual de inovação para a TEJ de Santa Catarina","hz":"C"},{"code":"6.1.1.2","text":"Até 2040, conceber, contratar e executar pelos menos 25 projetos de inovação propostos pelas instituições da rede de cooperação estadual de inovação para a TEJ no Estado de Santa Catarina, sendo no mínimo 5 projetos para a região do PETEJ-SC","hz":"M"}]},{"cod":"6.1.2","oe":"Estabelecer e fortalecer parcerias técnicas entre a rede estadual de cooperação em inovação para a TEJ de Santa Catarina e instituições nacionais e internacionais, públicas ou privadas, com experiência comprovada em pesquisa, desenvolvimento ou inovação aplicados à TEJ, para a execução conjunta de projetos","metas":[{"code":"6.1.2.1","text":"Até 2040, formalizar a cooperação e concluir 20 projetos de inovação para a TEJ, desenvolvidos conjuntamente por instituições integrantes da rede e instituições parceiras nacionais ou internacionais, com responsabilidades compartilhadas e entregas formalmente aceitas, conforme os respectivos planos de trabalho.","hz":"M"}]},{"cod":"6.1.3","oe":"Implantar e colocar em funcionamento polos regionais de inovação para a TEJ nos territórios catarinenses que ainda não dispõem dessas estruturas, priorizando a região do PETEJ-SC e integrando sua governança, seu planejamento e suas atividades à rede estadual de cooperação em inovação para a TEJ.","metas":[{"code":"6.1.3.1","text":"Até 2030, implantar e colocar em funcionamento pelo menos 4 polos regionais de inovação para a TEJ, sendo pelo menos um na região do PETEJ-SC, com constituição formal, governança instituída, infraestrutura física concluída e apta ao uso, equipe responsável designada e execução comprovada de atividades previstas em plano de trabalho.","hz":"C"},{"code":"6.1.3.2","text":"Conceber, contratar e concluir pelo menos 20 projetos de inovação para a TEJ nos novos polos regionais de inovação de Santa Catarina até 2040, com propostas técnicas aprovadas, responsabilidades e recursos definidos e entregas previstas nos respectivos planos de trabalho","hz":"M"}]}]},{"cod":"6.2","og":"Desenvolver atividades de pesquisa e desenvolvimento para setores produtivos do Polo PETEJ SC, com foco em soluções para uma economia de baixo carbono","desc":"Financiar e realizar projetos de P&D sobre produtos de interesse com potencial para aumentar a complexidade da econômia, consolidar a competitividade e contribuir para a descarbonização da economia regional, por meio de parcerias entre as universidades e os centros de inovação tecnológica do Polo PETEJ-SC.","oes":[{"cod":"6.2.1","oe":"Financiar e desenvolver projetos de P&D para usos alternativos do carvão mineral e aproveitamento de cinzas e rejeitos da mineração e da geração termelétrica","metas":[{"code":"6.2.1.1","text":"Até 2030, contratar e iniciar a execução técnica de pelo menos 5 projetos de pesquisa e desenvolvimento (P&D) voltados a usos alternativos do carvão mineral e ao aproveitamento de cinzas e rejeitos da mineração e da geração termelétrica","hz":"C"}]},{"cod":"6.2.2","oe":"Desenvolver um ecossistema de pesquisa, desenvolvimento e inovação na região sul dedicado aos materiais avançados (ex.: madeira engenheirada, cerâmica), com a participação dos atores do sistema regional de inovação","metas":[{"code":"6.2.2.1","text":"Até 2030, estruturar, implantar e colocar em funcionamento um centro de pesquisa, desenvolvimento e inovação em materiais avançados na região sul de Santa Catarina","hz":"C"},{"code":"6.2.2.2","text":"Até 2040 contratar pelos menos 10 projetos de pesquisa, desenvolvimento e inovação em materiais avançados","hz":"M"}]}]},{"cod":"6.3","og":"Atrair serviços intensivos em conhecimento","desc":"Apoiar o desenvolvimento de setores intensivos em conhecimento (ex.: ciências físicas e naturais, software, consultoria e suporte em tecnologia da informação etc.) para fomentar a sofisticação da base produtiva regional.","oes":[{"cod":"6.3.1","oe":"Instituir e operacionalizar um programa estadual de atração de empresas e instituições em setores intensivos de conhecimento","metas":[{"code":"6.3.1.1","text":"Até 2030, conceber, instituir formalmente e iniciar a execução de um programa estadual de atração de empresas e instituições de setores intensivos em conhecimento","hz":"C"}]}]},{"cod":"6.4","og":"Promover a digitalização, automação e eficiência energética em prol do aumento de produtividade das indústrias catarinenses","desc":"Promover a digitalização, a automação e a eficiência energética das indústrias para elevar a produtividade dos processos industriais do território e reduzir a emissão de GEE.","oes":[{"cod":"6.4.1","oe":"Avaliar o nível de digitalização, automação e eficiência energética de setores industriais de Santa Catarina, com análise específica do Polo PETEJ-SC, para identificar lacunas e oportunidades de modernização tecnológica e melhorias","metas":[{"code":"6.4.1.1","text":"Até 2030, concluir e aprovar um diagnóstico integrado sobre digitalização, automação e eficiência energética de setores industriais de Santa Catarina","hz":"C"}]},{"cod":"6.4.2","oe":"Promover a cooperação entre organizações do setor produtivo e do setor público para desenvolver e implementar projetos de digitalização e automação nas indústrias de Santa Catarina, priorizando o Polo PETEJ-SC","metas":[{"code":"6.4.2.1","text":"Até 2040, conceber, contratar e iniciar a execução técnica de pelo menos 15 projetos de digitalização e automação nas indústrias de Santa Catarina, desenvolvidos em cooperação entre organizações do setor produtivo e do setor público, sendo pelo menos 5 destinados ao Polo PETEJ-SC","hz":"M"}]}]},{"cod":"6.5","og":"Investir na educação, formação e qualificação de capital humano em ciência, tecnologia e inovação (CT&I)","desc":"Promover programa de educação superior e de educação profissional em CT&I nas regiões de Santa Catarina, em consonância com as vocações produtivas locais existentes e futuras","oes":[{"cod":"6.5.1","oe":"Desenvolver programa integrado de educação superior e de educação profissional em C,T&I, com base nas vocações produtivas locais existentes e futuras de Santa Catarina, com foco no Polo PETEJ SC","metas":[{"code":"6.5.1.1","text":"Até 2030 conceber, instituir formalmente e iniciar a execução de um programa integrado","hz":"C"}]},{"cod":"6.5.2","oe":"Estabelecer e operacionalizar parcerias entre instituições de ensino superior, centros tecnológicos, Sistema S e polos de inovação para oferecer formação em CT&I, nas modalidades de educação superior e de educação profissional e tecnológica, alinhada às demandas produtivas regionais existentes e futuras","metas":[{"code":"6.5.1.2","text":"Até 2040, realizar e concluir pelo menos 60 cursos de formação em CT&I, por meio de parcerias formalizadas entre as instituições participantes, contemplando educação superior e educação profissional, com planos de curso aprovados e registro dos concluintes certificados","hz":"M"}]}]},{"cod":"6.6","og":"Alavancar recursos adequados às exigências do âmbito da ciência, tecnologia e inovação (CT&I)","desc":"Atrair recursos capazes de absorver os riscos e incertezas ligados ao processo de inovação e ao desenvolvimento de pesquisa e tecnologias","oes":[{"cod":"6.6.1","oe":"Instituir e operacionalizar uma plataforma de interlocução entre o sistema financeiro e o setor produtivo a fim de alinhar instrumentos de financiamento às demandas territoriais de C,T&I e mobilizar recursos adicionais para projetos inovadores","metas":[{"code":"6.6.1.1","text":"Até 2030 desenvolver, instituir e colocar em funcionamento a plataforma de articulação entre o sistema financeiro e o setor produtivo","hz":"C"}]}]}]},{"n":7,"titulo":"Eixo 7 - Governança","ogs":[{"cod":"7.1","og":"Fortalecer a articulação interfederativa, interinstitucional e territorial do PETEJ-SC","desc":"Promover a coordenação entre União, Estado, municípios, associações regionais e demais instituições envolvidas na transição energética justa, com competências, responsabilidades e mecanismos permanentes de articulação definidos. Estruturar a cooperação com os diferentes arranjos territoriais, de modo a incorporar demandas, prioridades e especificidades regionais aos processos de planejamento e decisão do PETEJ-SC, considerando as capacidades institucionais e as prioridades de implementação estabelecidas pelo Estado.","oes":[{"cod":"7.1.1","oe":"Institucionalizar a articulação da governança estadual do PETEJ-SC com as instâncias federais de Transição Energética Justa e de transição energética, com rotinas de alinhamento, encaminhamento e devolutiva.","metas":[{"code":"7.1.1.1","text":"Até 2030, assegurar o funcionamento regular da articulação interfederativa do PETEJ-SC, com ponto focal estadual formalizado e agenda anual de interlocução com as instâncias federais pertinentes, cumprindo pelo menos 90% dos compromissos previstos sob responsabilidade estadual e mantendo o registro dos encaminhamentos e das devolutivas correspondentes.","hz":"C"}]},{"cod":"7.1.2","oe":"Integrar a atuação dos órgãos estaduais e das instituições com competências relacionadas ao PETEJ-SC, definindo responsabilidades e fluxos de cooperação para sua implementação.","metas":[{"code":"7.1.2.1","text":"Até 2030, consolidar e validar matriz interinstitucional de competências e interfaces, com responsabilidades e fluxos de cooperação definidos para todas as funções prioritárias de implementação do PETEJ-SC previamente identificadas e validadas pelas instâncias competentes.","hz":"C"},{"code":"7.1.2.2","text":"Até 2040, alcançar taxa mínima de 80% de conclusão, nos prazos pactuados, dos encaminhamentos interinstitucionais sob responsabilidade dos órgãos estaduais envolvidos na implementação do PETEJ-SC, considerando os três últimos anos de aferição.","hz":"M"}]},{"cod":"7.1.3","oe":"Operacionalizar a governança territorial do PETEJ-SC no Polo Sul, articulando o Estado, a AMREC, a AMUREL, a AMESC e os municípios e incorporando prioridades regionais aos processos de planejamento e decisão.","metas":[{"code":"7.1.3.1","text":"Até 2030, concluir pelo menos um ciclo de articulação territorial em cada uma das três associações regionais do Polo Sul (AMREC, AMUREL e AMESC), contemplando a interlocução com os municípios abrangidos, a sistematização das prioridades regionais e o registro dos encaminhamentos e devolutivas às instituições participantes.","hz":"C"},{"code":"7.1.3.2","text":"Até 2040, concluir pelo menos três ciclos adicionais de atualização e apreciação das agendas territoriais em cada uma das áreas de abrangência da AMREC, AMUREL e AMESC, assegurando a análise e a devolutiva fundamentada de todas as prioridades formalmente encaminhadas às instâncias de governança do PETEJ-SC nesses ciclos, com registro de sua incorporação ou não às decisões pertinentes.","hz":"M"}]}]},{"cod":"7.2","og":"Assegurar a capacidade institucional e a continuidade da implementação do PETEJ-SC","desc":"Consolidar o funcionamento das instâncias de governança previstas na Política Estadual de Transição Energética Justa, compatibilizando suas competências e composição com a estrutura administrativa vigente e estabelecendo regras decisórias e fluxos de atuação. Assegurar suporte técnico e executivo à implementação do Plano, com responsabilidades definidas, mecanismos de planejamento e procedimentos de sucessão e preservação da memória institucional que favoreçam sua continuidade diante de mudanças político-administrativas.","oes":[{"cod":"7.2.1","oe":"Assegurar a adequação institucional e o funcionamento regular das instâncias de governança previstas na Política Estadual de Transição Energética Justa, com competências, composição e regras de deliberação compatíveis com a estrutura administrativa vigente.","metas":[{"code":"7.2.1.1","text":"Até 2030, concluir a avaliação de adequação institucional de todas as instâncias de governança previstas na Política Estadual de Transição Energética Justa, com as atualizações normativas e administrativas de competência estadual realizadas e os ajustes dependentes de outras instâncias competentes formalmente encaminhados.","hz":"C"},{"code":"7.2.1.2","text":"Até 2030, assegurar o funcionamento regular das instâncias de governança cuja operacionalização esteja sob responsabilidade estadual, com regras de deliberação vigentes, calendários anuais aprovados e realização de pelo menos 90% das reuniões previstas em cada instância no ano de referência, com registro das deliberações correspondentes.","hz":"C"}]},{"cod":"7.2.2","oe":"Consolidar capacidade técnica e executiva de apoio às instâncias de governança do PETEJ-SC, assegurando a instrução das decisões, a coordenação dos encaminhamentos e a articulação com os órgãos responsáveis pela execução.","metas":[{"code":"7.2.2.1","text":"Até 2030, assegurar o funcionamento de arranjo de apoio técnico e executivo do PETEJ-SC, com responsáveis formalmente designados para todas as funções essenciais definidas pelas instâncias competentes e aplicação de procedimentos de instrução, encaminhamento e acompanhamento a todas das deliberações que demandem providências de execução, com identificação dos responsáveis, prazos e situação de atendimento.","hz":"C"}]},{"cod":"7.2.3","oe":"Assegurar a continuidade institucional do PETEJ-SC entre ciclos de gestão, preservando o planejamento, as responsabilidades, as informações e os processos necessários à implementação do Plano.","metas":[{"code":"7.2.3.1","text":"Até 2030, institucionalizar plano de trabalho da governança do PETEJ-SC, com atualização anual, e protocolo de continuidade administrativa que estabeleça procedimentos de sucessão, transferência de responsabilidades, acompanhamento de compromissos pendentes e preservação das informações necessárias à implementação do Plano.","hz":"C"},{"code":"7.2.3.2","text":"Até 2040, assegurar a aplicação do protocolo de continuidade institucional em todas as transições político-administrativas estaduais abrangidas desde sua instituição, com registro formal da transferência de responsabilidades, dos compromissos em andamento e das informações disponibilizadas à gestão sucessora.","hz":"M"}]},{"cod":"7.2.4","oe":"Fortalecer as capacidades técnico-institucionais dos municípios do Polo Sul para participar dos processos de governança, estruturar iniciativas e acompanhar sua execução no âmbito do PETEJ-SC.","metas":[{"code":"7.2.4.1","text":"Até 2030, concluir o diagnóstico das capacidades técnico-institucionais relacionadas à governança do PETEJ-SC em todos os municípios do Polo Sul e realizar pelo menos um ciclo de assistência técnica regionalizada em cada uma das áreas de abrangência da AMREC, AMUREL e AMESC, com registro dos municípios atendidos e das necessidades identificadas.","hz":"C"},{"code":"7.2.4.2","text":"Até 2040, assegurar que pelo menos 80% dos municípios classificados como prioritários para assistência técnica, conforme critérios previamente definidos, demonstrem utilização efetiva de instrumentos de governança do PETEJ-SC em processos de participação institucional, estruturação de propostas ou acompanhamento de iniciativas, mediante comprovação documental.","hz":"M"}]}]},{"cod":"7.3","og":"Assegurar a participação social efetiva e a proteção dos grupos afetados nas decisões do PETEJ-SC","desc":"Estabelecer critérios de representação e condições para a participação efetiva de trabalhadores, comunidades afetadas, setor produtivo, academia e sociedade civil na formulação, implementação e acompanhamento do PETEJ-SC. Institucionalizar mecanismos de escuta, análise das contribuições e devolutiva fundamentada, assegurando sua consideração nos processos decisórios e a aplicação de salvaguardas de justiça voltadas à proteção dos grupos afetados.","oes":[{"cod":"7.3.1","oe":"Assegurar critérios transparentes de representação e condições efetivas de participação dos segmentos envolvidos e afetados nas instâncias e nos processos decisórios de governança do PETEJ-SC.","metas":[{"code":"7.3.1.1","text":"Até 2030, formalizar critérios públicos de representação e participação nas instâncias e nos processos decisórios de governança do PETEJ-SC, observadas as composições legalmente estabelecidas, assegurando condições de participação aos segmentos prioritários identificados no mapeamento de atores e instituindo acompanhamento anual da participação efetiva e das lacunas de representatividade por segmento.","hz":"C"}]},{"cod":"7.3.2","oe":"Assegurar a análise, a consideração e a devolutiva fundamentada das contribuições recebidas nos processos participativos, com registro de sua influência nas decisões do PETEJ-SC.","metas":[{"code":"7.3.2.1","text":"Até 2030, instituir e aplicar procedimento de análise e devolutiva fundamentada das contribuições recebidas nos processos participativos do PETEJ-SC, assegurando o registro do tratamento de todas as contribuições formais admissíveis e resposta fundamentada, nos prazos estabelecidos, a pelo menos 90% delas, com indicação de sua incorporação às decisões ou das razões para sua não incorporação.","hz":"C"}]},{"cod":"7.3.3","oe":"Incorporar salvaguardas de justiça aos processos de elegibilidade, priorização, financiamento e revisão dos projetos do PETEJ-SC, considerando seus efeitos sobre trabalhadores, comunidades e territórios.","metas":[{"code":"7.3.3.1","text":"Até 2030, e previamente à primeira rodada formal de priorização ou financiamento de projetos no âmbito do PETEJ-SC, aprovar matriz de salvaguardas de justiça e assegurar sua aplicação à avaliação de todas as propostas submetidas a essas decisões, com registro dos riscos, impactos e condicionantes pertinentes à proteção de trabalhadores, comunidades e territórios.","hz":"C"},{"code":"7.3.3.2","text":"Até 2040, assegurar o acompanhamento periódico e documentado do cumprimento das salvaguardas de justiça em pelo menos 90% dos projetos em execução sujeitos a esses requisitos no âmbito do PETEJ-SC, com encaminhamento das situações de descumprimento identificadas às instâncias responsáveis pela definição de medidas de adequação ou revisão.","hz":"M"}]}]},{"cod":"7.4","og":"Viabilizar a implementação da carteira de projetos do PETEJ-SC","desc":"Estabelecer condições institucionais, técnicas e financeiras para a estruturação, priorização e implementação dos projetos do PETEJ-SC, com critérios de elegibilidade, responsabilidades definidas e acompanhamento dos estágios de maturidade e dos entraves à execução. Articular os projetos priorizados às fontes e aos instrumentos de financiamento compatíveis com suas características e necessidades, estabelecendo mecanismos de coordenação, governança e acompanhamento dos recursos mobilizados.","oes":[{"cod":"7.4.1","oe":"Estabelecer critérios transparentes de elegibilidade e priorização dos projetos, considerando sua aderência aos objetivos estratégicos, às prioridades territoriais e às salvaguardas do PETEJ-SC.","metas":[{"code":"7.4.1.1","text":"Até 2030, e previamente à primeira rodada formal de seleção de projetos do PETEJ-SC, aprovar e publicar critérios de elegibilidade e priorização, procedimentos de avaliação e requisitos de instrução das propostas, incorporando a aderência aos objetivos estratégicos, às prioridades territoriais e às salvaguardas de justiça, e assegurar sua aplicação a todas as propostas submetidas à seleção, com registro fundamentado das decisões.","hz":"C"}]},{"cod":"7.4.2","oe":"Ampliar a maturidade e a prontidão para implementação dos projetos prioritários, mediante acompanhamento de seus estágios de desenvolvimento e encaminhamento dos entraves técnicos, institucionais e operacionais.","metas":[{"code":"7.4.2.1","text":"Até 2030, colocar em funcionamento carteira integrada dos projetos formalmente priorizados no âmbito do PETEJ-SC, com classificação dos estágios de maturidade, identificação dos entraves à implementação, responsáveis por seu encaminhamento e marcos de progressão, assegurando a realização de ciclos trimestrais de acompanhamento e atualização.","hz":"C"},{"code":"7.4.2.2","text":"Até 2040, assegurar que pelo menos 60% dos projetos da carteira prioritária de referência de 2030 que ainda demandavam maturação tenham alcançado condições de prontidão para implementação ou iniciado sua execução, conforme critérios de maturidade previamente definidos e verificação documental, mantendo o acompanhamento dos entraves e encaminhamentos relativos aos demais projetos.","hz":"M"}]},{"cod":"7.4.3","oe":"Ampliar as condições de financiamento dos projetos priorizados, articulando-os às fontes e aos instrumentos financeiros compatíveis com suas características, necessidades e estágios de maturidade.","metas":[{"code":"7.4.3.1","text":"Até 2030, consolidar o diagnóstico das necessidades de financiamento dos projetos prioritários do PETEJ-SC, identificando para cada projeto as fontes e os instrumentos potencialmente compatíveis, os requisitos de elegibilidade, as necessidades adicionais de estruturação e as lacunas de financiamento, com definição dos encaminhamentos necessários à sua preparação para captação de recursos.","hz":"C"},{"code":"7.4.3.2","text":"Até 2040, alcançar compromissos formais de aporte de recursos para etapas definidas de implementação em pelo menos 50% dos projetos prioritários que tenham atingido condições de aptidão para captação até 2035, mediante articulação com fontes e instrumentos de financiamento compatíveis, mantendo o registro dos valores comprometidos e efetivamente mobilizados.","hz":"M"}]},{"cod":"7.4.4","oe":"Estabelecer mecanismos de governança para a mobilização, alocação e acompanhamento dos recursos destinados à carteira de projetos do PETEJ-SC, com critérios e responsabilidades definidos.","metas":[{"code":"7.4.4.1","text":"Até 2030, e previamente à primeira alocação de recursos sob gestão dos instrumentos financeiros vinculados ao PETEJ-SC, estabelecer critérios e responsabilidades para elegibilidade, aprovação, aplicação, acompanhamento e prestação de contas, assegurando o registro da origem, destinação e situação de execução dos recursos abrangidos pelos mecanismos de governança financeira, observadas as competências e finalidades legais de cada instrumento.","hz":"C"}]}]},{"cod":"7.5","og":"Assegurar a transparência, o monitoramento e o aperfeiçoamento contínuo da governança do PETEJ-SC","desc":"Organizar mecanismos integrados de registro, publicidade e rastreabilidade dos critérios, decisões, responsabilidades e encaminhamentos das instâncias de governança. Assegurar o monitoramento da implementação do PETEJ-SC, com informações e indicadores sobre ações, projetos, recursos e resultados, mecanismos periódicos de reporte e prestação de contas e avaliações do desempenho e da maturidade institucional que orientem o aperfeiçoamento dos instrumentos e processos de governança.","oes":[{"cod":"7.5.1","oe":"Assegurar a transparência ativa e a rastreabilidade dos processos decisórios da governança do PETEJ-SC, com publicidade dos critérios, fundamentos, responsabilidades e encaminhamentos.","metas":[{"code":"7.5.1.1","text":"Até 2030, assegurar o registro padronizado dos critérios, fundamentos, responsáveis e encaminhamentos de todas as deliberações formais das instâncias de governança do PETEJ-SC, com disponibilização pública dos documentos sujeitos à transparência ativa e publicação de pelo menos 90% deles nos prazos estabelecidos, observadas as hipóteses legais de restrição de acesso.","hz":"C"}]},{"cod":"7.5.2","oe":"Monitorar de forma integrada a implementação do PETEJ-SC e o cumprimento de suas metas, mediante indicadores, informações territorializadas e mecanismos periódicos de reporte e prestação de contas.","metas":[{"code":"7.5.2.1","text":"Até 2030, colocar em funcionamento mecanismo integrado de monitoramento dos sete eixos do PETEJ-SC, com conjunto mínimo de indicadores, fontes, responsáveis, periodicidades e recortes territoriais definidos, assegurando a atualização tempestiva de pelo menos 80% dos indicadores previstos para aferição em cada ciclo de monitoramento.","hz":"C"},{"code":"7.5.2.2","text":"Até 2030, concluir pelo menos um ciclo anual completo de acompanhamento e prestação de contas da implementação do PETEJ-SC, com reportes trimestrais e relatório anual consolidado disponibilizado publicamente, contemplando a situação das metas, dos projetos e dos recursos mobilizados, os desvios identificados e as providências encaminhadas às instâncias responsáveis.","hz":"C"}]},{"cod":"7.5.3","oe":"Avaliar periodicamente o desempenho e a maturidade institucional da governança do PETEJ-SC, promovendo o aperfeiçoamento de seus instrumentos e processos a partir dos resultados identificados.","metas":[{"code":"7.5.3.1","text":"Até 2030, instituir e aplicar metodologia de avaliação do desempenho e da maturidade institucional da governança do PETEJ-SC, com dimensões, critérios e linha de base definidos, realizando pelo menos uma avaliação completa e aprovando plano de aprimoramento institucional com medidas prioritárias, responsáveis, prazos e procedimentos de acompanhamento.","hz":"C"},{"code":"7.5.3.2","text":"Até 2040, alcançar progressão de pelo menos um nível de maturidade institucional, em relação à linha de base estabelecida até 2030, em ao menos metade das dimensões identificadas como prioritárias para aprimoramento na avaliação inicial, conforme metodologia previamente aprovada, com registro das medidas de aperfeiçoamento implementadas.","hz":"M"}]}]}]}],"E":{"1":{"short":"Energia e cadeia do carvão","sint":"Transformar energia e carvão, reduzindo emissões com segurança e competitividade","prem":["Segurança, qualidade e competitividade","Integração ao SIN","Flexibilidade além das renováveis","Rotas por uso final","Energia lidera as emissões em SC","Biogás e biometano","Redes elétricas e de gás","Diversificação viável","Gás natural com demanda firme","Transição do Complexo Jorge Lacerda"]},"2":{"short":"Ambiental","sint":"Qualidade ambiental, descarbonização e recuperação das áreas degradadas","prem":["Obrigações e reparação de passivos","Evitar novos passivos","Solo, água, vegetação e fauna","Novos usos compatíveis","Agropecuária de baixo impacto","Redução e remoção de carbono","Aproveitamento seguro de resíduos","Riscos climáticos","Prioridades baseadas em evidências","Comunidades e articulação institucional"]},"3":{"short":"Desenvolvimento econômico territorial","sint":"Diversificar a economia com empregos de qualidade e maior complexidade","prem":["Transformação de toda a economia","Diversificar antes da perda do carvão","Vocações produtivas locais","Diversificação inteligente","Integração com outras regiões","Ativos territoriais reconvertíveis","Fontes de financiamento diversas"]},"4":{"short":"Infraestrutura","sint":"Infraestrutura logística e digital que integre o território","prem":["Vetor para os demais eixos","Desigualdades entre municípios","Articulação federativa","Setor privado como aliado","Especificidades territoriais","Critérios sociais e ambientais"]},"5":{"short":"Social, trabalho, emprego e renda","sint":"Transição participativa, com proteção de direitos e repartição equitativa","prem":["Pessoas no centro das decisões","Acesso sem discriminação","Participação desde o início","Informação acessível e periódica","Respostas por município e grupo","Responsabilidade por passivos","Repartição equitativa","Planejamento antecipado e revisável"]},"6":{"short":"Ciência, tecnologia e inovação","sint":"Sistema regional de inovação que enraíze atividades de conhecimento","prem":["Inovação como aprendizado interativo","Inovação e competitividade","Cooperação entre atores","Capacidades descentralizadas","Base local de ensino e pesquisa","Novos usos do carvão em validação","Capital humano planejado"]},"7":{"short":"Governança","sint":"Coordenação, participação, transparência e capacidade de implementação","prem":["Papéis e interfaces definidos","Articulação federal–estadual","Governança territorial","Representação e devolutiva","Informação integrada","Continuidade institucional","Carteira de projetos priorizada","Governança do financiamento"]}}};

function currentEixo() {

function ringSVG() {
