<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>PETEJ-SC Quadro Estratégico</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&display=swap">
<style>
/* Layout: sticky institutional header · left navigation tree (eixo › objetivo geral) · reading column with drill-down pages */
:root {
  --bg: #F4F7FA;
  --surface: #FFFFFF;
  --surface-2: #EEF3F8;
  --ink: #2C3E50;
  --ink-strong: #0D2B4E;
  --muted: #5F6B7A;
  --faint: #8A94A3;
  --line: #D0DDED;
  --brand: #0D2B4E;
  --brand-2: #2E6DAD;
  --accent: #3BA6AC;
  --hero: #0D2B4E;
  --hero-ink: #FFFFFF;
  --hero-muted: #BFD3EA;
  --e1: #0D2B4E; --e1-ring: #3F6EA6; --e2: #3E8E5E; --e3: #2E6DAD; --e4: #4A9DD4; --e5: #D9912B; --e6: #3BA6AC; --e7: #5A5F8C;
  --hz-c: #4A9DD4; --hz-m: #2E6DAD; --hz-l: #0D2B4E;
  --shadow: 0 1px 2px rgba(13,43,78,.06), 0 4px 14px rgba(13,43,78,.06);
  --f-display: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --f-body: "Carlito", Calibri, "Segoe UI", system-ui, sans-serif;
  --r: 10px;
  --side-w: 272px;
  --head-h: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1828; --surface: #12233A; --surface-2: #182D48; --ink: #D7E2EE; --ink-strong: #F1F6FB; --muted: #A3B3C6; --faint: #7C8DA3;
    --line: #26405F; --brand: #9FC3E6; --brand-2: #6FA6DE; --accent: #56C0C6; --hero: #0F2742; --hero-ink: #FFFFFF; --hero-muted: #A9C4E2;
    --e1: #5B86C5; --e1-ring: #5B86C5; --e2: #5BB47F; --e3: #5A93D3; --e4: #6DB5E3; --e5: #E6A548; --e6: #4FC0C6; --e7: #9195CC;
    --hz-c: #8CC3EA; --hz-m: #4F8FD2; --hz-l: #2B5FA0;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1828; --surface: #12233A; --surface-2: #182D48; --ink: #D7E2EE; --ink-strong: #F1F6FB; --muted: #A3B3C6; --faint: #7C8DA3;
  --line: #26405F; --brand: #9FC3E6; --brand-2: #6FA6DE; --accent: #56C0C6; --hero: #0F2742; --hero-ink: #FFFFFF; --hero-muted: #A9C4E2;
  --e1: #5B86C5; --e1-ring: #5B86C5; --e2: #5BB47F; --e3: #5A93D3; --e4: #6DB5E3; --e5: #E6A548; --e6: #4FC0C6; --e7: #9195CC;
  --hz-c: #8CC3EA; --hz-m: #4F8FD2; --hz-l: #2B5FA0;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--head-h) + 16px); }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
a { color: inherit; }
h1, h2, h3 { font-family: var(--f-display); color: var(--ink-strong); text-wrap: balance; margin: 0; line-height: 1.2; }
svg { display: block; }
.ico { width: 1em; height: 1em; display: inline-block; flex: none; }
.ico svg { width: 100%; height: 100%; }
:focus-visible { outline: 2px solid var(--brand-2); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- header ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { height: var(--head-h); display: flex; align-items: center; gap: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.menu-btn { display: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink-strong); width: 38px; height: 38px; border-radius: 8px; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; }
.brand { display: flex; align-items: center; gap: 14px; text-decoration: none; min-width: 0; }
.brand img { height: 22px; width: auto; }
.brand .logo-dark { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .brand .logo-light { display: none; } :root:not([data-theme="light"]) .brand .logo-dark { display: block; } }
:root[data-theme="dark"] .brand .logo-light { display: none; }
:root[data-theme="dark"] .brand .logo-dark { display: block; }
.brand-txt { border-left: 1px solid var(--line); padding-left: 14px; line-height: 1.15; min-width: 0; }
.brand-txt b { display: block; font-family: var(--f-display); font-size: 15px; color: var(--ink-strong); white-space: nowrap; }
.brand-txt span { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.search { margin-left: auto; position: relative; width: min(380px, 40vw); }
.search input { width: 100%; height: 38px; border: 1px solid var(--line); border-radius: 19px; background: var(--surface-2); color: var(--ink); padding: 0 14px 0 36px; font: inherit; font-size: 15px; }
.search .ico { position: absolute; left: 13px; top: 11px; color: var(--faint); font-size: 15px; }
.results { position: absolute; right: 0; top: 46px; width: min(560px, 92vw); max-height: 70vh; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 8px; }
.results h4 { margin: 10px 8px 4px; font: 700 11px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.results a { display: flex; gap: 10px; padding: 8px; border-radius: 8px; text-decoration: none; font-size: 14px; color: var(--ink); }
.results a:hover, .results a:focus-visible { background: var(--surface-2); }
.results mark { background: color-mix(in srgb, var(--hz-c) 30%, transparent); color: inherit; border-radius: 2px; }
.results .none { padding: 12px 8px; color: var(--muted); font-size: 14px; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); gap: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1440px; margin: 0 auto; }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--head-h)); align-self: start; height: calc(100vh - var(--head-h) - env(safe-area-inset-top, 0px)); overflow: auto; padding-block: 20px 32px; font-size: 14.5px; }
.side h5 { margin: 18px 10px 6px; font: 700 11px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.side a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; text-decoration: none; color: var(--ink); }
.side a:hover { background: var(--surface-2); }
.side a.on { background: var(--surface); box-shadow: var(--shadow); color: var(--ink-strong); font-weight: 700; }
.side .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 11px; flex: none; }
.side .dot .ico { font-size: 11px; }
.side .sub { margin: 2px 0 8px 22px; border-left: 1px solid var(--line); padding-left: 8px; }
.side .sub a { font-size: 13.5px; padding: 5px 8px; color: var(--muted); align-items: flex-start; }
.side .sub a b { color: var(--ink-strong); font-weight: 700; min-width: 2.2em; }
.side .sub a.on { color: var(--ink-strong); }
.main { min-width: 0; padding-block: 24px 64px; }
.scrim { display: none; }

@media (max-width: 960px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .menu-btn { display: inline-flex; }
  .side { position: fixed; z-index: 40; left: 0; top: 0; bottom: 0; height: auto; width: min(300px, 86vw); background: var(--bg); border-right: 1px solid var(--line); padding: calc(env(safe-area-inset-top, 0px) + 16px) 12px 24px max(12px, env(safe-area-inset-left, 0px)); transform: translateX(-105%); transition: transform .2s ease; }
  body.nav-open .side { transform: none; }
  body.nav-open .scrim { display: block; position: fixed; inset: 0; z-index: 35; background: rgba(5,15,30,.45); }
  .brand-txt span { display: none; }
}
@media (max-width: 620px) {
  .brand-txt { display: none; }
  .search { width: auto; flex: 1; }
}

/* ---------- shared bits ---------- */
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13.5px; color: var(--muted); margin-bottom: 14px; }
.crumbs a { text-decoration: none; }
.crumbs a:hover { color: var(--brand-2); text-decoration: underline; }
.crumbs .ico { font-size: 9px; color: var(--faint); }
.eyebrow { font: 700 12px/1.2 var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--brand-2); }
.sec { margin-top: 36px; }
.sec-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; margin-bottom: 14px; }
.sec-h h2 { font-size: 22px; }
.sec-h p { margin: 0; color: var(--muted); font-size: 14.5px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); }
.badge { display: inline-grid; place-items: center; border-radius: 50%; color: #fff; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.code { font-variant-numeric: tabular-nums; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-strong); padding: 8px 14px; border-radius: 999px; text-decoration: none; font-weight: 700; font-size: 14px; cursor: pointer; }
.btn:hover { border-color: var(--brand-2); color: var(--brand-2); }
.btn.solid { background: var(--x, var(--brand)); border-color: transparent; color: #fff; }
.btn.solid:hover { filter: brightness(1.08); color: #fff; }
.hzbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--surface-2); }
.hzbar i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.stats { display: flex; flex-wrap: wrap; gap: 10px 26px; }
.stat b { display: block; font: 800 28px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 13.5px; }

/* ---------- home ---------- */
.hero { background: var(--hero); color: var(--hero-ink); border-radius: 14px; padding: 32px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 28px; align-items: center; overflow: hidden; }
.hero h1 { color: var(--hero-ink); font-size: clamp(28px, 4vw, 40px); font-weight: 800; }
.hero .eyebrow { color: var(--hero-muted); }
.hero p { color: var(--hero-muted); max-width: 60ch; margin: 12px 0 22px; font-size: 16.5px; }
.hero .stat b { color: #fff; }
.hero .stat span { color: var(--hero-muted); }
.ring { width: 280px; max-width: 100%; }
.ring a path { transition: filter .15s; }
.ring a:hover path, .ring a:focus-visible path { filter: brightness(1.15); }
.ring text { font: 700 11px var(--f-body); fill: #fff; }
@media (max-width: 760px) { .hero { grid-template-columns: minmax(0, 1fr); padding: 22px; } .ring { width: 230px; margin: 0 auto; } }
.ecard { display: flex; flex-direction: column; gap: 10px; padding: 18px; text-decoration: none; transition: transform .15s, border-color .15s; }
.ecard:hover { transform: translateY(-2px); border-color: var(--x); }
.ecard .top-row { display: flex; align-items: center; gap: 12px; }
.ecard .badge { width: 42px; height: 42px; background: var(--x); font-size: 19px; }
.ecard .num { font: 800 12px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--x); }
.ecard h3 { font-size: 17px; }
.ecard p { margin: 0; color: var(--muted); font-size: 14.5px; flex: 1; }
.ecard .counts { display: flex; gap: 14px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ecard .counts b { color: var(--ink-strong); font-size: 15px; }
.matrix { width: 100%; border-collapse: collapse; font-size: 14.5px; font-variant-numeric: tabular-nums; }
.matrix th { text-align: left; font: 700 11.5px/1.2 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 10px 12px; border-bottom: 1px solid var(--line); }
.matrix td { padding: 9px 12px; border-bottom: 1px solid var(--line); }
.matrix tr:last-child td { border-bottom: 0; }
.matrix td.n { width: 18%; }
.matrix .cell { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 700; color: var(--ink-strong); }
.matrix .cell i { display: inline-block; border-radius: 50%; flex: none; }
.matrix .ename { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 700; color: var(--ink-strong); }
.matrix .ename .badge { width: 26px; height: 26px; background: var(--x); font-size: 12px; }
.tbl-wrap { overflow-x: auto; }
.hztiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; margin-bottom: 16px; }
.hztile { position: relative; color: #fff; padding: 16px 30px 16px 22px; text-decoration: none; display: flex; align-items: center; gap: 14px; clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 50%, calc(100% - 18px) 100%, 0 100%, 14px 50%); }
.hztile:first-child { clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 50%, calc(100% - 18px) 100%, 0 100%); border-radius: 10px 0 0 10px; }
.hztile b { font: 800 34px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.hztile span { line-height: 1.2; font-size: 14px; }
.hztile span strong { display: block; font-size: 16px; }
.hztile:hover { filter: brightness(1.08); }
@media (max-width: 620px) { .hztiles { grid-template-columns: minmax(0, 1fr); gap: 6px; } .hztile, .hztile:first-child { clip-path: none; border-radius: 10px; } }

/* ---------- eixo page ---------- */
.ehead { display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 22px; padding: 26px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
.ehead .big { font: 800 56px/0.9 var(--f-display); color: var(--x); }
.ehead h1 { font-size: clamp(24px, 3vw, 32px); margin-top: 8px; }
.ehead .foco { margin-top: 16px; padding: 14px 16px; border-radius: 10px; background: color-mix(in srgb, var(--x) 9%, var(--surface)); }
.ehead .foco .eyebrow { color: var(--x); }
.ehead .foco p { margin: 6px 0 0; max-width: 72ch; }
.ehead aside { display: flex; flex-direction: column; gap: 10px; }
.ehead .badge { width: 72px; height: 72px; background: var(--x); font-size: 32px; }
.mini { display: flex; align-items: baseline; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); text-decoration: none; }
.mini b { font: 800 24px/1 var(--f-display); color: var(--x); font-variant-numeric: tabular-nums; }
.mini span { color: var(--muted); font-size: 14px; }
a.mini:hover { outline: 1px solid var(--x); }
@media (max-width: 760px) { .ehead { grid-template-columns: minmax(0, 1fr); padding: 18px; } .ehead aside { flex-direction: row; flex-wrap: wrap; } .ehead aside .badge { display: none; } .mini { flex: 1 1 140px; } }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; text-decoration: none; color: var(--ink); }
.chip i { font-style: normal; font-weight: 700; color: var(--x); font-variant-numeric: tabular-nums; }
a.chip:hover { border-color: var(--x); }
.ogcard { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; padding: 18px; text-decoration: none; }
.ogcard:hover { border-color: var(--x); }
.ogcard .badge { width: 46px; height: 46px; background: var(--x); font: 800 15px var(--f-display); grid-row: span 2; }
.ogcard h3 { font-size: 17px; align-self: center; }
.ogcard p { margin: 4px 0 0; color: var(--muted); font-size: 14.5px; }
.ogcard .foot { grid-column: 2; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; font-size: 13px; color: var(--muted); }
.ogcard .foot b { color: var(--ink-strong); }

/* ---------- premissas ---------- */
.prem { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; counter-reset: p; }
.prem li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; padding: 16px 18px; }
.prem .badge { width: 32px; height: 32px; background: var(--x); font-weight: 700; font-size: 14px; grid-row: span 2; }
.prem h3 { font-size: 16px; }
.prem p { margin: 0; color: var(--ink); max-width: 75ch; }
.note { font-size: 13px; color: var(--faint); margin-top: 10px; }

/* ---------- objetivo geral page ---------- */
.ghead { padding: 24px; border-radius: 14px; background: var(--x); color: #fff; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 20px; }
.ghead .code-big { font: 800 44px/1 var(--f-display); grid-row: span 3; opacity: .95; }
.ghead .eyebrow { color: rgba(255,255,255,.8); }
.ghead h1 { color: #fff; font-size: clamp(21px, 2.6vw, 28px); }
.ghead p { margin: 6px 0 0; color: rgba(255,255,255,.9); max-width: 80ch; }
@media (max-width: 620px) { .ghead { grid-template-columns: minmax(0, 1fr); padding: 18px; } .ghead .code-big { grid-row: auto; font-size: 34px; } }
.oe { padding: 0; overflow: hidden; }
.oe-h { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 16px 18px; background: color-mix(in srgb, var(--x) 8%, var(--surface)); border-bottom: 1px solid var(--line); }
.oe-h .pill { background: var(--x); color: #fff; margin-top: 2px; }
.oe-h p { margin: 0; color: var(--ink-strong); font-weight: 700; }
.oe-h a { font-size: 13px; color: var(--brand-2); white-space: nowrap; text-decoration: none; font-weight: 700; }
.oe-h a:hover { text-decoration: underline; }
.hzcols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.hzcol { padding: 14px 16px 16px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.hzcol:last-child { border-right: 0; }
.hzlab { display: flex; align-items: center; gap: 8px; font: 700 12px/1.2 var(--f-body); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.hzlab i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.hzlab em { font-style: normal; letter-spacing: 0; text-transform: none; font-weight: 400; color: var(--faint); }
.meta { padding: 10px 12px; border-radius: 8px; background: var(--surface-2); font-size: 14.5px; border-left: 3px solid var(--h); }
.meta .code { display: block; font-weight: 700; font-size: 12.5px; color: var(--x); margin-bottom: 2px; }
.meta p { margin: 0; }
.empty { font-size: 13px; color: var(--faint); font-style: italic; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 8px; }
@media (max-width: 860px) { .hzcols { grid-template-columns: minmax(0, 1fr); } .hzcol { border-right: 0; border-bottom: 1px solid var(--line); } .hzcol:last-child { border-bottom: 0; } }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 32px; }
.pager a { padding: 14px 16px; text-decoration: none; display: flex; flex-direction: column; gap: 2px; font-size: 14px; color: var(--muted); }
.pager a b { color: var(--ink-strong); font-size: 15px; }
.pager a.next { text-align: right; grid-column: 2; }
.pager a:hover { border-color: var(--brand-2); }

/* ---------- objetivo específico page (timeline) ---------- */
.tl { position: relative; display: grid; gap: 0; margin-top: 8px; }
.tl-step { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 18px; position: relative; padding-bottom: 22px; }
.tl-step::before { content: ""; position: absolute; left: 54px; top: 46px; bottom: 0; width: 2px; background: var(--line); }
.tl-step:last-child::before { display: none; }
.tl-when { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.tl-when .yr { width: 64px; height: 46px; border-radius: 23px; display: grid; place-items: center; background: var(--h); color: #fff; font: 800 17px var(--f-display); font-variant-numeric: tabular-nums; position: relative; z-index: 1; }
.tl-when span { font: 700 11.5px/1.2 var(--f-body); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.tl-body { display: grid; gap: 10px; padding-top: 4px; }
.tl-body .meta { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--h); box-shadow: var(--shadow); font-size: 15.5px; padding: 12px 16px; }
@media (max-width: 560px) { .tl-step { grid-template-columns: 70px minmax(0, 1fr); gap: 12px; } .tl-step::before { left: 34px; } .tl-when .yr { width: 58px; } }
.siblings { display: flex; flex-wrap: wrap; gap: 8px; }
.siblings a { text-decoration: none; }
.siblings a.on { background: var(--x); color: #fff; border-color: transparent; }
.siblings a.on i { color: #fff; }

/* ---------- metas explorer ---------- */
.filters { display: grid; gap: 12px; padding: 16px; margin-bottom: 18px; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 7px 14px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.seg button i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.seg button em { font-style: normal; color: var(--faint); font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"] { background: var(--ink-strong); color: var(--bg); border-color: transparent; }
.seg button[aria-pressed="true"] em { color: inherit; opacity: .75; }
.filters input { height: 38px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); color: var(--ink); padding: 0 12px; font: inherit; width: 100%; }
.count { font-size: 14px; color: var(--muted); margin: 0 0 10px; }
.mgroup { margin-top: 22px; }
.mgroup > h3 { display: flex; align-items: center; gap: 10px; font-size: 17px; margin-bottom: 10px; }
.mgroup > h3 .badge { width: 28px; height: 28px; background: var(--x); font-size: 13px; }
.mrow { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 4px 14px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.mrow:last-child { border-bottom: 0; }
.mrow .pill { background: color-mix(in srgb, var(--h) 18%, var(--surface)); color: var(--ink-strong); justify-self: start; }
.mrow .pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--h); display: inline-block; }
.mrow .txt { font-size: 15px; }
.mrow .txt b { color: var(--x); font-size: 13px; margin-right: 6px; }
.mrow .ref { grid-column: 2; font-size: 13px; color: var(--muted); }
.mrow .ref a { color: var(--brand-2); text-decoration: none; font-weight: 700; }
.mrow .ref a:hover { text-decoration: underline; }
@media (max-width: 560px) { .mrow { grid-template-columns: minmax(0, 1fr); } .mrow .ref { grid-column: 1; } }

.foot { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--faint); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
const D = {"A":[{"n":1,"eixo":"Transformação do setor de energia e da cadeia do carvão","foco":"Promover a transformação integrada do sistema energético de Santa Catarina e da cadeia regional do carvão, reduzindo progressivamente as emissões de GEE e a intensidade de carbono com segurança, qualidade, flexibilidade, resiliência, modicidade e competitividade, por meio da diversificação da matriz energética, eficiência e eletrificação dos usos finais, da expansão e modernização das infraestruturas energéticas e do aproveitamento das potencialidades territoriais e de fontes renováveis e de baixo carbono, segundo os princípios da transição justa.","premissas":["A transformação do setor de energia deve preservar a segurança do abastecimento, a qualidade e a confiabilidade dos serviços, a flexibilidade, a resiliência, a modicidade e a competitividade da economia catarinense.","A segurança energética de Santa Catarina deve considerar sua integração estrutural ao Sistema Interligado Nacional (SIN), bem como às cadeias externas de suprimento, não sendo a autossuficiência energética estadual condição para atender à demanda atual.","A elevada participação de fontes renováveis não assegura, por si só, a flexibilidade do sistema. A expansão da geração distribuída e a baixa capacidade de regularização de parte da geração hidrelétrica aumentam a necessidade de redes adequadas, recursos flexíveis, armazenamento, gestão da demanda e sistemas de controle.","As rotas de descarbonização devem ser definidas de acordo com as características de cada uso final. A eficiência energética e a eletrificação devem ser priorizadas quando técnica, econômica e ambientalmente adequadas, enquanto combustíveis de baixo carbono podem atender atividades de difícil eletrificação.","Em Santa Catarina, o setor energético é o principal responsável pelas emissões de GEE, enquanto, no cenário nacional, predominam as emissões da agropecuária e da mudança no uso da terra e das florestas.","O biogás e o biometano constituem oportunidades específicas para Santa Catarina, em razão da disponibilidade regional de resíduos industriais, urbanos e, sobretudo, agropecuários, da possibilidade de produção descentralizada e da existência de projetos no setor de transportes.","A capacidade e a coordenação das infraestruturas de transmissão e distribuição de energia elétrica e de transporte de gás natural condicionam a expansão da oferta, o atendimento a novas demandas e a integração de fontes renováveis de baixo carbono.","A diversificação da matriz energética deve considerar a disponibilidade de recursos, as potencialidades territoriais, as restrições socioambientais, a viabilidade técnica e econômica e as condições da infraestrutura necessária à integração das diferentes fontes.","A expansão da infraestrutura de gás natural deve ser orientada pela existência de demanda firme, vocação produtiva, possibilidade de uso compartilhado, contribuição para a redução das emissões de GEE e integração do biometano, evitando ativos ociosos ou incompatíveis com a trajetória de descarbonização.","A trajetória do Complexo Termelétrico Jorge Lacerda deve ser planejada de forma coordenada com a redução das emissões de GEE e a substituição dos serviços prestados, considerando uma transição justa e ordenada da cadeia carbonífera."]},{"n":2,"eixo":"Ambiental","foco":"Promover a melhoria da qualidade ambiental e a descarbonização do território em transição, mediante a redução das emissões de GEE e de poluentes, a prevenção e mitigação dos impactos ambientais e a recuperação das áreas degradadas pela cadeia produtiva do carvão mineral. Esse direcionamento compreende a prevenção de novos passivos, o cumprimento das obrigações ambientais e a orientação para o fechamento, a reabilitação e os novos usos de minas e usinas, em consonância com a conservação dos ecossistemas, a proteção dos recursos naturais e o bem-estar das comunidades.","premissas":["A transição pressupõe o cumprimento das obrigações ambientais e a reparação dos passivos existentes.","As alternativas de transição devem evitar a geração de novos passivos e o agravamento da degradação ambiental.","As intervenções devem considerar, conjuntamente, solos, recursos hídricos, proteção e restauração da vegetação natural, da fauna e das funções ecológicas.","Os novos usos das áreas devem ser compatíveis com suas características, aptidão, condições ambientais e restrições legais.","As alternativas agropecuárias devem privilegiar práticas de baixo impacto e a conservação dos recursos naturais, considerando a aptidão produtiva e o contexto local.","As práticas alternativas devem ser avaliadas quanto ao seu potencial de redução de emissões, de remoção de CO₂ e de armazenamento de carbono.","O aproveitamento de resíduos, como a produção de biometano, deve observar critérios de viabilidade técnica e de segurança ambiental.","As soluções voltadas à produção, resiliência climática e ambiental, devem considerar os riscos climáticos e as condições necessárias à manutenção dos benefícios ambientais no longo prazo.","A definição de prioridades deve apoiar-se em diagnósticos ambientais, na avaliação de riscos climáticos e de impactos socioambientais, bem como em resultados verificáveis.","As decisões devem considerar as comunidades afetadas e a articulação com os programas e as responsabilidades institucionais existentes."]},{"n":3,"eixo":"Desenvolvimento econômico territorial","foco":"Promover a diversificação da economia regional, durante o processo de transição energética, conciliando a geração de empregos de qualidade em setores de menor intensidade de emissões, a atração de novas cadeias de maior complexidade e a ampliação da pauta exportadora e de recursos, para uma economia competitiva, resiliente, de baixo carbono e socialmente equilibrada.","premissas":["A transição energética justa impulsiona a transformação econômica, que abrange toda a economia de Santa Catarina, podendo contribuir para a redução das desigualdades internas do Estado e para elevar a complexidade da base econômica, dentro dos limites socioecológicos.","A transformação da base econômica precisa ocorrer antes da perda potencial da atividade carbonífera, pois a cadeia do carvão sustenta empregos com salários superiores aos da atividade típica da base produtiva e representa parte da arrecadação municipal.","A diversificação parte das vocações produtivas locais, considerando que a competitividade futura da economia depende da inovação e da sustentabilidade.","A diversificação econômica precisa ser inteligente e sustentável, rumo à sofisticação da economia dentro dos limites socioecológicos.","A diversificação econômica do Polo PETEJ-SC precisa ser integrada às outras regiões de Santa Catarina, valorizando os setores produtivos existentes e potenciais.","As áreas mineradas degradadas, após sua restauração, bem como as infraestruturas disponíveis, compõem um potencial de ativos territoriais reconvertíveis para apoiar a transformação da base econômica regional.","O financiamento das diferentes ações para conseguir a diversificação econômica, precisa integrar fontes de recursos heterogêneas (setor público, privado e sociedade civil) e se adequar aos níveis de incerteza e riscos associados aos setores produtivos financiáveis."]},{"n":4,"eixo":"Desenvolvimento de Infraestrutura","foco":"Modernizar e expandir a infraestrutura logística e digital regional, conciliando a integração do território às redes estaduais e nacionais e contribuindo para a redução das desigualdades entre as regiões do estado, a fim de sustentar a diversificação econômica e a inclusão produtiva.","premissas":["A infraestrutura constitui vetor para os demais eixos, e sua expansão precisa acompanhar o desenvolvimento das novas atividades da base produtiva regional.","O desenvolvimento da infraestrutura deve considerar as diferenças nas dotações entre os municípios da região.","As decisões de infraestrutura dependem de competências de diferentes níveis federativos, o que exige articulação entre a União, os Estados e os municípios.","O setor produtivo privado pode ser um aliado do setor público no desenvolvimento de infraestruturas.","As infraestruturas precisam ser planejadas levando em conta as especificidades territoriais.","Elementos ambientais e sociais, além dos econômicos, precisam ser incorporados às avaliações do desenvolvimento de infraestruturas (ex.: impactos socioambientais, salvaguardas sociais etc.)."]},{"n":5,"eixo":"Social, Bem-estar, Trabalho, Emprego e Renda","foco":"Conduzir a transição energética em Santa Catarina de forma participativa, transparente e territorialmente sensível, assegurando a proteção, a promoção e o respeito dos direitos humanos das pessoas trabalhadoras, das comunidades e dos grupos potencialmente afetados, bem como uma distribuição equitativa dos custos, riscos e benefícios das transformações econômicas, energéticas e socioambientais.","premissas":["As pessoas trabalhadoras, suas famílias e as comunidades afetadas devem estar no centro das decisões sobre o ritmo, as prioridades e os investimentos da transição.","As oportunidades e os benefícios da transição devem ser acessíveis sem discriminação, considerando as barreiras enfrentadas por mulheres, pessoas negras, povos indígenas, comunidades tradicionais, migrantes, pessoas com deficiência e outros grupos em situação de vulnerabilidade.","A participação de pessoas trabalhadoras, sindicatos, comunidades e demais grupos afetados precisa ocorrer desde o planejamento e permitir influência efetiva nas decisões, na implementação e na revisão do PETEJ.","Informações sobre cenários, cronogramas, impactos, responsabilidades e resultados da transição devem ser divulgadas periodicamente e em linguagem, formato e meio de comunicação acessíveis aos diferentes públicos.","Definir respostas de transição adequadas às condições de cada município e grupo social, com base em diagnósticos atualizados de sua relação com a cadeia carbonífera e dos impactos da transição, evitando soluções uniformes e priorizando as pessoas e comunidades mais vulneráveis","As responsabilidades pelos impactos e passivos da cadeia carbonífera devem ser definidas com urgência e clareza, acompanhadas de prestação de contas periódica à sociedade, em formato claro e acessível.","Os territórios e grupos que suportaram os impactos da atividade carbonífera devem participar dos benefícios da transição, enquanto seus custos e riscos devem ser distribuídos de forma equitativa.","O planejamento da transição precisa começar antes do encerramento das atividades e ser revisto à luz de novos cenários, evidências e contribuições da sociedade ao longo de seu desenvolvimento."]},{"n":6,"eixo":"Ciência, Tecnologia e Inovação","foco":"Fortalecer o sistema regional de inovação por meio da cooperação entre atores (ex.: universidades, centros tecnológicos e de inovação, empresas, sociedade civil e instituições públicas) para enraizar, no território, atividades intensivas em conhecimento, em prol de uma economia competitiva, sustentável e inclusiva.","premissas":["A inovação é um processo interativo e de aprendizado, caracterizado por inúmeras e contínuas interações e retroalimentações, em que o conhecimento e as competências são elementos fundamentais.","A inovação impulsiona a competitividade do sistema produtivo da região e orienta a nova vocação produtiva do território dentro dos limites socioecológicos.","A cooperação entre os atores do sistema de inovação é crucial.","As capacidades de inovação de Santa Catarina precisam ser descentralizadas e distribuídas de forma equitativa entre as regiões do Estado.","O Polo PETEJ-SC conta com universidades, centros tecnológicos e de inovação, bem como instituições de formação técnica, que constituem a base do ensino, da pesquisa e da formação para promover a inovação na região.","Os outros usos do carvão e o aproveitamento de rejeitos e cinzas dependem de pesquisa e de validação técnica e econômica antes da adoção em escala.","A formação do capital humano é crucial e deve ser planejada com antecedência, em sintonia com as novas atividades previstas para o território."]},{"n":7,"eixo":"Governança","foco":"Coordenação integrada da transição energética justa, assegurando articulação interfederativa e interinstitucional, participação social efetiva, representação territorial, transparência e rastreabilidade das decisões, proteção dos grupos afetados e capacidade institucional e financeira para implementar, monitorar e dar continuidade ao PETEJ-SC.","premissas":["A coordenação da TEJ deve articular competências, capacidades e interesses distribuídos entre a União, os Estados, os municípios, as empresas, as instituições técnicas, os agentes financeiros e a sociedade civil, com responsabilidades e interfaces claramente definidas.","Os arranjos federais e estaduais de governança coexistem e precisam de mecanismos e rotinas permanentes de articulação, reporte e devolutiva, de modo a reduzir sobreposições e lacunas na coordenação.","A governança territorial deve considerar AMREC, AMUREL e AMESC, bem como as diferenças de capacidade institucional entre municípios e associações.","A participação social e a proteção dos grupos afetados requerem critérios de representação, canais permanentes de escuta e mecanismos de devolutiva e de prestação de contas.","A transparência e a rastreabilidade dependem da organização integrada das informações sobre atores, projetos, investimentos, decisões e indicadores.","A continuidade institucional exige instâncias compatíveis com a estrutura administrativa vigente e suficientemente formalizadas para resistir a mudanças de governo.","A implementação do PETEJ-SC depende de uma carteira de projetos estruturada, com critérios transparentes de priorização, responsabilidades definidas e acompanhamento da execução.","A governança do financiamento depende da articulação entre fontes, instrumentos e mecanismos de financiamento, bem como de uma carteira de projetos elegíveis alinhada às prioridades do Polo Sul"]}],"B":[{"n":1,"titulo":"Eixo 1 - Transformação do setor de energia e da cadeia do carvão","ogs":[{"cod":"1.1","og":"Reduzir progressivamente as emissões de GEE e a intensidade de carbono do sistema energético de Santa Catarina","desc":"Promover a transformação da oferta e do consumo de energia para reduzir as emissões de GEE por meio do planejamento integrado, da eficiência energética e da eletrificação dos usos finais, sem comprometer a segurança do abastecimento, a qualidade dos serviços, os custos para os consumidores e a competitividade da economia catarinense.","oes":[{"cod":"1.1.1","oe":"Monitorar e contabilizar as emissões de GEE do sistema energético de Santa Catarina, abrangendo a oferta, a transformação e o consumo de energia.","metas":[{"code":"1.1.1.1","text":"Até 2030, estabelecer e publicar metodologia, linha de base, governança e rotina anual de contabilização das emissôes de GEE energéticas, cobrindo 100% dos energéticos e setores representados no balanço energético estadual.","hz":"C"},{"code":"1.1.1.2","text":"Até 2040, consolidar a série anual de emissões de GEE energéticas referente ao período de 2030 a 2040, realizando sua atualização e publicação anual.","hz":"M"},{"code":"1.1.1.3","text":"Até 2050, manter atualizada a série anual de emissões de GEE energéticas referente ao período de 2030 a 2050, realizando sua atualização e publicação anual.","hz":"L"}]},{"cod":"1.1.2","oe":"Institucionalizar o planejamento energético integrado, com atualização periódica do balanço energético estadual, dos cenários de oferta e demanda e da carteira de infraestrutura e tecnologias.","metas":[{"code":"1.1.2.1","text":"Até 2030, institucionalizar e publicar o primeiro ciclo de planejamento energético integrado, contemplando o balanço energético estadual, os cenários de oferta e demanda e a carteira de infraestrutura e tecnologias, com responsáveis, governança e calendário de atualização definidos.","hz":"C"},{"code":"1.1.2.2","text":"Até 2040, cumprir, no período de 2031 a 2040, o calendário de atualização e publicação do balanço energético estadual, da carteira de infraestrutura e tecnologias e dos cenários de oferta e demanda.","hz":"M"},{"code":"1.1.2.3","text":"Até 2050, cumprir, no período de 2041 a 2050, o calendário de atualização e publicação dos componentes do planejamento energético integrado e publicar uma avaliação consolidada da trajetória energética estadual de 2030 a 2050, com recomendações para o ciclo de planejamento subsequente.","hz":"L"}]},{"cod":"1.1.3","oe":"Ampliar a eficiência energética e a gestão da demanda nos usos finais de energia.","metas":[{"code":"1.1.3.1","text":"Até 2030, estabelecer e publicar linhas de base de consumo e demanda, avaliar o potencial de eficiência energética da demanda nos setores e grupos de consumidores definidos como prioritários e definir metas setoriais para 2040 e 2050, acompanhadas de uma carteira de medidas e de metodologia de medição e verificação.","hz":"C"},{"code":"1.1.3.2","text":"Até 2040, alcançar as metas de economia de energia e redução da demanda de ponta definidas para 2040, com resultados medidos e verificados, e atualizar a carteira de medidas e as metas para 2050.","hz":"M"},{"code":"1.1.3.3","text":"Até 2050, alcançar as metas de economia de energia e redução da demanda de ponta definidas para 2050, com resultados medidos e verificados, e publicar a avaliação consolidada dos resultados obtidos desde 2030.","hz":"L"}]},{"cod":"1.1.4","oe":"Promover a eletrificação dos usos finais de energia.","metas":[{"code":"1.1.4.1","text":"Até 2030, elaborar e publicar roteiros de eletrificação para os setores definidos como prioritários, com diagnósticos dos usos finais passíveis de eletrificação, avaliação dos requisitos de infraestrutura e rede, definição de metas setoriais para 2040 e 2050 e estabelecimento de uma carteira inicial de projetos.","hz":"C"},{"code":"1.1.4.1","text":"Até 2040, alcançar as metas setoriais de eletrificação estabelecidas para 2040, implementar as soluções de infraestrutura e rede necessárias aos projetos implatados e atualizar os roteiros, a carteira de projetos e as metas para 2050.","hz":"M"},{"code":"1.1.4.1","text":"Até 2050, alcançar as metas setoriais de eletrificação estabelecidas para 2050, assegurando a integração da carga adicional ao sistema energético, e publicar a avaliação consolidada dos resultados obtidos desde 2030.","hz":"L"}]}]},{"cod":"1.2","og":"Planejar, modernizar e expandir, de forma coordenada, as infraestruturas energéticas de Santa Catarina","desc":"Planejar, modernizar e expandir as infraestruturas energéticas, ampliando a segurança, a flexibilidade e a resiliência dos sistemas elétricos e de gás, bem como sua aptidão para integrar fontes renováveis, gases de baixo carbono e novas cargas.","oes":[{"cod":"1.2.1","oe":"Coordenar a estratégia de expansão das redes de distribuição para viabilizar a descentralização da oferta energética.","metas":[{"code":"1.2.1.1","text":"Até 2030, avaliar a capacidade de conexão das subestações e dos alimentadores da carteira territorial definida previamente com as distribuidoras, considerando carga máxima e mínima, fluxos reversos e as trajetórias de MMGD e eletrificação, e definir solução técnica, responsável e prazo para as restrições críticas identificadas.","hz":"C"},{"code":"1.2.1.2","text":"Até 2040, coordenar, com as distribuidoras, a entrada em operação das soluções de integração da oferta descentralizada e de novas cargas com implantação pactuada na carteira de 2030, respeitando os prazos de atendimento definidos para cada intervenção.","hz":"M"},{"code":"1.2.1.3","text":"Até 2050, concluir a avaliação integrada das soluções de distribuição implantadas desde 2030 e pactuar, com as distribuidoras, a carteira do ciclo seguinte, considerando capacidade de conexão, restrições remanescentes e novas necessidades de geração descentralizada e de cargas, com prioridades, responsáveis e prazos definidos.","hz":"L"}]},{"cod":"1.2.2","oe":"Monitorar os planos de expansão e reforço dos sistemas de transmissão e distribuição, de modo a apoiar a transformação do sistema energético e a integração de cargas eletrointensivas.","metas":[{"code":"1.2.2.1","text":"Até 2030, instituir monitoramento dos projetos de reforço e expansão, pontos críticos e novas cargas, incluindo as intervenções relacionadas às restrições internas e de intercâmbio, com responsáveis, marcos, prazos e situação de atendimento, mantendo atualização anual até 2050.","hz":"C"},{"code":"1.2.2.2","text":"Até 2040, publicar avaliação intermediária da execução das intervenções de transmissão e distribuição monitorada desde 2030, consolidando as evidências dos agentes competentes sobre a prontidão das soluções necessárias ao atendimento no cenário de transição do CTJL, e registrar, para 100% dos desvios críticos identificados, encaminhamentos, responsáveis e prazos de acompanhamento, preservando as providências exigíveis nos ciclos anuais.","hz":"M"},{"code":"1.2.2.3","text":"Até 2050, publicar avaliação integrada da execução dos planos monitorados entre 2030 e 2050, do atendimento às cargas prioritárias e das restrições remanescentes, e pactuar com os agentes envolvidos as prioridades e a rotina de monitoramento do ciclo seguinte, com responsáveis e calendário definidos.","hz":"L"}]},{"cod":"1.2.3","oe":"Expandir a infraestrutura de gás natural e biometano com demanda âncora e interoperabilidade, tendo como requisito a modicidade tarifária.","metas":[{"code":"1.2.3.1","text":"Até 2030, mapear demandas âncora, potênciais corredores azuis e pontos de integração de biometano, comparar alternativas de rede canalizada, redes locais e logística de gás comprimido, e avaliar 100% dos projetos da carteira prioritária quanto à viabilidade técnico-econômica, modicidade tarifária e demanda operativa. Pactuar cronograma até 2040 para os projetos viáveis selecionados, com capacidades, responsáveis e fontes de recursos identificadas.","hz":"C"},{"code":"1.2.3.2","text":"Até 2040, colocar em operação, nos prazos pactuados, as expansões de infraestrutura de gás e integração de biometano previstas na carteira aprovada em 2030, preservando os critérios de viabilidade, modicidade tarifária e trajetória de priorização que fundamentem sua seleção.","hz":"M"},{"code":"1.2.3.3","text":"Até 2050, concluir a avaliação do desempenho das expansões de infraestrutura de gás implantadas desde 2030 e pactuar diretrizes para o ciclo seguinte, considerando demanda, utilização dos ativos, integração de biometano com prioridades de adequação ou expansão compatíveis com a trajetória de expansão.","hz":"L"}]},{"cod":"1.2.4","oe":"Garantir a resiliência das infraestruturas energéticas.","metas":[{"code":"1.2.4.1","text":"Até 2030, definir a carteira e elaborar avaliação de risco dos ativos, corredores, cargas críticas e aprovar planos de contingência, continuidade ou adaptação para os itens de risco alto, definindo padrões de continuidade e recomposição por categoria de carga crítica e cenários de risco de referência.","hz":"C"},{"code":"1.2.4.2","text":"Até 2040, concluir, nos prazos definidos, as medidas de resiliência de prioridade alta da carteira aprovada em 2030, sob responsabilidade estadual ou acordadas com os demais agentes, e verificar sua eficácia por testes, simulados ou desempenho em eventos.","hz":"M"},{"code":"1.2.4.3","text":"Até 2050, assegurar que as cargas críticas da carteira prioritária atualizada disponham de atendimento energético que cumpra os padrões de continuidade e recomposição pactuados por categoria, nos cenários de risco de referência, com desempenho verificado em testes ou eventos.","hz":"L"}]}]},{"cod":"1.3","og":"Diversificar a oferta energética de Santa Catarina, valorizando as potencialidades regionais do estado","desc":"Ampliar e integrar fontes renováveis, combustíveis de baixo carbono, recursos de flexibilidade e tecnologias emergentes, considerando o valor sistêmico, a disponibilidade de recursos, as potencialidades territoriais, as restrições socioambientais, a viabilidade técnica e econômica e a infraestrutura necessária.","oes":[{"cod":"1.3.1","oe":"Fomentar a oferta de fontes renováveis a partir de uma carteira territorialmente qualificada e compatível com a capacidade de conexão e o licenciamento.","metas":[{"code":"1.3.1.1","text":"Até 2030, consolidar a carteira estadual de projetos renováveis, incluindo iniciativas do Programa Energia Boa, avaliar os projetos do primeiro ciclo segundo critérios territoriais, de conexão, licenciamento e pré-viabilidade técnico-econômica e socioambiental, priorizar os aptos a avançar e pactuar a referência quantitativa de capacidade renovável em operação para 2050, por fonte e modalidade.","hz":"C"},{"code":"1.3.1.2","text":"Até 2040, cumprir, nos prazos individuais pactuados, os marcos sob responsabilidade estadual de apoio à implantação dos projetos renováveis viáveis da carteira de 2030, sem postergar os compromissos previstos até 2035, registrando entregas, atrasos e revisões justificadas.","hz":"M"},{"code":"1.3.1.3","text":"Até 2050, alcançar a capacidade de geração renovável de eletricidade em operação pactuada até 2030 para esse horizonte, por fonte e modalidade, com base nos cenários do PETEJ-SC e na qualificação das alternativas, considerando conexão, licenciamento e viabilidade técnico-econômica e socioambiental.","hz":"L"}]},{"cod":"1.3.2","oe":"Estimular pesquisa, desenvolvimento e inovação para ampliar o conhecimento sobre as potencialidades energéticas regionais de Santa Catarina.","metas":[{"code":"1.3.2.1","text":"Até 2030, instituir e publicar uma agenda estadual de P&D e inovação em energia, orientada às lacunas identificadas nos diagnósticos e cenários do PETEJ-SC, com governança, prioridades, critérios de seleção, carteira inicial, cronograma e fontes potenciais de recursos, incluindo oportunidades de enquadramento em programas de P&D regulado em articulação com a CELESC e outros agentes.","hz":"C"},{"code":"1.3.2.2","text":"Até 2040, concluir, nos prazos definidos, os projetos do primeiro ciclo da agenda estadual de P&D em energia previstos para o período, com entregas técnicas aceitas e resultados não sigilosos disponibilizados para subsidiar o planejamento energético.","hz":"M"},{"code":"1.3.2.3","text":"Até 2050, avaliar a contribuição dos projetos da agenda estadual de P&D executados desde 2030 para o conhecimento das potencialidades energéticas regionais e para o planejamento, e publicar a agenda do ciclo seguinte, com lacunas de conhecimento, prioridades, governança, critérios de seleção e estratégia de financiamento atualizados.","hz":"L"}]},{"cod":"1.3.3","oe":"Fomentar o aproveitamento energético sustentável da biomassa e dos resíduos florestais, agroindustriais e industriais.","metas":[{"code":"1.3.3.1","text":"Até 2030, qualificar a disponibilidade, a localização, a logística e a sustentabilidade das rotas de biomassa selecionadas no primeiro ciclo e concluir os estudos de pré-viabilidade dos projetos da carteira prioritária, considerando usos concorrentes e restrições de suprimento.","hz":"C"},{"code":"1.3.3.2","text":"Até 2040, colocar em operação, nos prazos pactuados, os projetos de aproveitamento energético da biomassa selecionados para implantação na carteira de 2030, condicionados à viabilidade comprovada, ao suprimento sustentável e rastreável, ao licenciamento e ao financiamento assegurado.","hz":"M"},{"code":"1.3.3.3","text":"Até 2050, avaliar os resultados energéticos e a sustentabilidade das rotas e projetos de biomassa apoiados desde 2030 e pactuar a carteira do ciclo seguinte, com prioridades, responsáveis e cronograma, considerando energia efetivamente produzida, rastreabilidade, disponibilidade sustentável de matérias-primas, logística e usos concorrentes.","hz":"L"}]},{"cod":"1.3.4","oe":"Desenvolver a cadeia do biogás e do biometano, articulando oferta regional, beneficiamento, infraestrutura e usos prioritários.","metas":[{"code":"1.3.4.1","text":"Até 2030, consolidar a base estadual georreferenciada de oferta, demanda e infraestrutura de biogás e biometano, concluir a pré-viabilidade dos projetos do primeiro ciclo e pactuar a carteira de implantação até 2040, com capacidades, usos, formas de entrega e marcos até 2035, além da referência quantitativa de biogás para uso direto e de biometano para os usos prioritários em 2050.","hz":"C"},{"code":"1.3.4.2","text":"Até 2040, colocar em operação, nos prazos pactuados, os projetos de biogás e biometano selecionados para implantação na carteira de 2030, com viabilidade comprovada, suprimento de substratos, licenciamento, financiamento e destinação do gás produzido assegurados.","hz":"M"},{"code":"1.3.4.3","text":"Até 2050, alcançar os volumes anuais de biogás para uso energético direto e de biometano para os usos prioritários pactuados até 2030 para esse horizonte, com produção e destinação comprovadas, respeitando a disponibilidade sustentável de substratos.","hz":"L"}]}]},{"cod":"1.4","og":"Promover a transformação do sistema energético catarinense e da cadeia do carvão, observando os princípios da TEJ","desc":"Promover o acesso a energia confiável, acessível e de menor emissão, distribuir de forma equitativa os custos e benefícios das escolhas energéticas e orientar a transformação gradual do CTJL, preservando ou substituindo de forma coordenada os serviços técnico-energéticos relevantes.","oes":[{"cod":"1.4.1","oe":"Incorporar a perspectiva de justiça energética ao planejamento, à formulação e à avaliação das políticas, programas e iniciativas energéticas da administração pública estadual.","metas":[{"code":"1.4.1.1","text":"Até 2030, elaborar e publicar o referencial estadual de justiça energética, identificar os órgãos e instrumentos estaduais aos quais seus critérios se aplicam e estabelecer um programa de capacitação e implementação.","hz":"C"},{"code":"1.4.1.2","text":"Até 2040, incorporar os critérios de justiça energética aos instrumentos estaduais identificados como pertinentes e aplicar a avaliação dos impactos distributivos nas políticas, nos programas e nas iniciativas energéticas estratégicas.","hz":"M"},{"code":"1.4.1.3","text":"Até 2050, publicar uma avaliação consolidada da aplicação dos critérios de justiça energética entre 2030 e 2050 e atualizar o referencial estadual com recomendações para o ciclo subsequente.","hz":"L"}]},{"cod":"1.4.2","oe":"Ampliar o acesso à energia confiável, acessível e de menor emissão nos territórios e grupos com maior vulnerabilidade energética.","metas":[{"code":"1.4.2.1","text":"Até 2030, estabelecer e aplicar uma metodologia estadual de identificação da vulnerabilidade energética, elaborar a linha de base dos territórios e grupos prioritários e publicar um plano de intervenção com metas de acesso, confiabilidade, acessibilidade econômica e redução de emissões de GEE para 2040 e 2050.","hz":"C"},{"code":"1.4.2.2","text":"Até 2040, alcançar as metas estabelecidas para 2040 nos territórios e grupos prioritáros, mediante a implementação das interveções previstas, e atualizar o diagnóstico, o plano de intervenção e as metas para 2050.","hz":"M"},{"code":"1.4.2.3","text":"Até 2050, alcançar as metas estabelecidas para 2050 e publicar uma avaliação consolidada da evolução da vulnerabilidade energética e dos resultados das intervenções realizadas desde 2030.","hz":"L"}]},{"cod":"1.4.3","oe":"Planejar e orientar tecnicamente a transformação gradual do Complexo Termelétrico Jorge Lacerda, considerando suas funções técnico-energéticas e com base em pesquisa, desenvolvimento, inovação e análise multicritério de alternativas tecnológicas.","metas":[{"code":"1.4.3.1","text":"Até 2030, concluir e publicar a análise multicritério de alternativas e o roteiro para a transformação do Complexo Termelétrico Jorge Lacerda até 2040, contemplando etapas, condições, riscos, pontos de decisão e requisitos técnicos, energéticos, ambientais, econômico-financeiros e sociais.","hz":"C"},{"code":"1.4.3.2","text":"Até 2040, concluir a transformação do Complexo Termelétrico Jorge Lacerda conforme roteiro estabelecido, assegurando que suas funções técnico-energéticas relevantes tenham sido preservadas ou substituídas e que seus aspectos técnicos, ambientais e socioeconômicos tenham sido monitorados.","hz":"M"},{"code":"1.4.3.3","text":"Até 2050, publicar uma avaliação consolidada do período posterior à transformação do Completo Termelétrico Jorge Lacerda, considerando o desempenho das soluções implantadas, as emissões de GEE, a segurança e a confiabilidade do sistema energético e os efeitos sobre o emprego e a economia regional.","hz":"L"}]}]}]},{"n":2,"titulo":"Eixo 2 - Ambiental","ogs":[{"cod":"2.1","og":"Prevenir novos passivos e assegurar o cumprimento das obrigações e a continuidade das ações ambientais","desc":"Prevenir a geração de novos passivos e assegurar o cumprimento das obrigações legais, condicionantes ambientais e decisões judiciais. Articular as iniciativas com o PRADSUL/SC e os projetos existentes, com responsabilidades definidas, coordenação institucional, financiamento e equipes para execução, manutenção, fiscalização e monitoramento de longo prazo.","oes":[{"cod":"2.1.1","oe":"Reduzir as pendências de cumprimento das obrigações ambientais dos empreendimentos.","metas":[{"code":"2.1.1.1","text":"Até 2030, reduzir em 50% o número de obrigações ambientais vencidas e não cumpridas, em relação a 2026/2027.","hz":"C"},{"code":"2.1.1.2","text":"Até 2040, reduzir em 100% o número de obrigações ambientais vencidas e não cumpridas, em relação a 2026/2027.","hz":"M"}]},{"cod":"2.1.2","oe":"Evitar a formação de novos passivos ambientais nas intervenções da transição","metas":[{"code":"2.1.2.1","text":"Até 2030, assegurar que 100% das intervenções da transição energética tenham medidas preventivas implantadas anteriores ao início das obras. Nenhum novo passivo ambiental identificado sem correção no prazo determinado pelo órgão competente.","hz":"C"}]},{"cod":"2.1.3","oe":"Assegurar a coordenação entre os projetos de recuperação ambiental, incluindo sua articulação com o PRADSUL/SC.","metas":[{"code":"2.1.3.1","text":"Até 2030, integrar 100% dos projetos de recuperação ambiental abrangidos pelo plano a uma programação conjunta, articulada com o PRADSUL/SC, com responsáveis, cronogramas e interfaces formalizados e revisados anualmente.","hz":"C"}]},{"cod":"2.1.4","oe":"Garantir financiamento e equipes técnicas para executar, manter e monitorar as intervenções ambientais.","metas":[{"code":"2.1.4.1","text":"Até 2030, assegurar que 100% das intervenções ambientais em execução tenham financiamento formalizado para os meses seguintes (a depender da intervenção) e preenchimento de todas as funções técnicas essenciais previstas nos planos de trabalho.","hz":"C"}]}]},{"cod":"2.2","og":"Priorizar as intervenções e avaliar seus resultados com base em diagnósticos e monitoramento ambiental","desc":"Selecionar áreas e intervenções considerando os diagnósticos dos meios físico e biótico, a gravidade dos danos, os riscos à saúde humana, a exposição das comunidades, a vulnerabilidade dos ecossistemas e as obrigações de recuperação já estabelecidas. Basear o acompanhamento das ações em linhas de base, indicadores e critérios de êxito relacionados à qualidade do solo, da água e do ar, à recuperação da biodiversidade, às emissões e ao cumprimento das obrigações ambientais. A divulgação periódica dos resultados subsidia a avaliação e a revisão das medidas adotadas.","oes":[{"cod":"2.2.1","oe":"Ampliar o conhecimento sobre as condições ambientais das áreas afetadas","metas":[{"code":"2.2.1.1","text":"Até 2030, concluir mapeamento e levantamento de dados dos meios físico e biótico em 100% das áreas classificadas como prioritárias no inventário territorial de 2026/2027. As informações devem ser suficientes para definir intervenções e indicadores de acompanhamento.","hz":"C"}]},{"cod":"2.2.2","oe":"Direcionar as intervenções às áreas de maior prioridade ambiental e social.","metas":[{"code":"2.2.2.1","text":"Até 2030, estabelecer o conjunto de classificação de prioridade ambiental e social com base em metodologia específica para a transição.","hz":"C"},{"code":"2.2.2.2","text":"Até 2040, iniciar as intervenções previstas em 100% das áreas de prioridade muito alta e em pelo menos 75% das áreas de prioridade alta, conforme classificação coordenada aé 2030.","hz":"M"}]},{"cod":"2.2.3","oe":"Ampliar a verificação da execução e da eficácia ambiental das intervenções, desde as obras até a estabilização das áreas recuperadas.","metas":[{"code":"2.2.3.1","text":"Até 2030, ter uma linha de base, indicadores, critérios e sistema de verificação, para 100% das intervenções em execução no estado. As verificações devem ser mantidas até a comprovação da estabilização ambiental.","hz":"C"}]}]},{"cod":"2.3","og":"Recuperar os solos, a qualidade dos recursos hídricos e os ecossistemas e conservar a biodiversidade local","desc":"Compreender, na recuperação, a remediação de solos contaminados e a melhoria da qualidade das águas superficiais e subterrâneas, com controle da drenagem ácida de mina, da erosão, do assoreamento e da dispersão de contaminantes, considerando as conexões entre as áreas mineradas e as bacias hidrográficas afetadas. Contemplar na restauração, a recuperação de Áreas de Preservação Permanente, nascentes e habitats degradados, com recomposição da vegetação nativa, controle de espécies exóticas invasoras e recuperação das condições necessárias à fauna local. As intervenções consideram os ecossistemas de referência, o potencial de regeneração natural e a conectividade entre os remanescentes de vegetação.","oes":[{"cod":"2.3.1","oe":"Recuperar as condições físicas e químicas do solo, com controle dos riscos de contaminação e capacidade de sustentar a vegetação e os usos previstos.","metas":[{"code":"2.3.1.1","text":"Até 2040, comprovar que pelo menos 70% da superfície prioritária para recuperação do solo, delimitada até 2030, atende aos critérios físicos, químicos e de controle de riscos estabelecidos para sua destinação.","hz":"M"}]},{"cod":"2.3.2","oe":"Reduzir a geração de drenagem ácida de mina e a contaminação das águas superficiais e subterrâneas.","metas":[{"code":"2.3.2.1","text":"Até 2040, reduzir em pelo menos 50% a carga anual dos contaminantes prioritários transportada pelas drenagens monitoradas das áreas de intervenção, em relação a 2026/2027.","hz":"M"}]},{"cod":"2.3.3","oe":"Reduzir a erosão e o transporte de sedimentos para os corpos hídricos e reduzir as interferências da mineração na drenagem natural e no regime das águas subterrâneas.","metas":[{"code":"2.3.3.1","text":"Até 2040, estabilizar 80% da superfície com erosão ativa e recuperar 70% dos trechos de drenagem e pontos de alteração do regime subterrâneo classificados como prioritários, segundo critérios de desempenho definidos até 2030.","hz":"M"}]},{"cod":"2.3.4","oe":"Reduzir a presença de espécies exóticas invasoras nas áreas em restauração e conservar as populações de espécies nativas da fauna e da flora local, especialmente as ameaçadas de extinção.","metas":[{"code":"2.3.4.1","text":"Até 2040, reduzir em 50% a cobertura de espécies exóticas invasoras nas áreas acompanhadas, em relação a 2026/2027, e manter ou ampliar a ocupação dos habitats pelas espécies nativas prioritárias monitoradas.","hz":"M"}]},{"cod":"2.3.5","oe":"Recuperar a cobertura vegetal nativa e sua capacidade de regeneração em APPs, nascentes e demais habitats degradados, considerando a conexão entre remanescentes de vegetação nativa.","metas":[{"code":"2.3.5.1","text":"Até 2050, alcançar os critérios de recuperação da vegetação nativa em 80% da superfície de APPs, nascentes e habitats degradados selecionada até 2030, incluindo pelo menos 70% dos trechos prioritários para conexão entre remanescentes.","hz":"L"}]}]},{"cod":"2.4","og":"Assegurar o fechamento responsável, a reabilitação de minas e usinas e aprimorar a gestão de rejeitos e resíduos da cadeia produtiva do carvão","desc":"Contemplar no planejamento, as exigências ambientais do fechamento e da reabilitação, incluindo os passivos de minas abandonadas e órfãs. Os novos usos das áreas e estruturas estão condicionados à segurança geotécnica, à qualidade ambiental, às restrições legais e à aptidão territorial, com manutenção e acompanhamento após o encerramento das atividades. Abranger, na gestão, o manejo, a estabilização, o tratamento e a destinação ambientalmente adequada de rejeitos, estéreis e demais resíduos. O aproveitamento desses materiais está condicionado à viabilidade técnica e ambiental e ao controle dos riscos de contaminação.","oes":[{"cod":"2.4.1","oe":"Assegurar a estabilidade do terreno, a segurança das estruturas e o controle da contaminação no fechamento e pós-fechamento de minas e usinas.","metas":[{"code":"2.4.1.1","text":"Até 2030, assegurar que todas as áreas e estruturas em fechamento ou pós-fechamento classificadas como de alto risco tenham medidas de estabilização e controle da contaminação implantadas, com desempenho verificado ao menos anualmente.","hz":"C"}]},{"cod":"2.4.2","oe":"Tornar as áreas e estruturas desativadas aptas a novos usos compatíveis com suas condições ambientais.","metas":[{"code":"2.4.2.1","text":"Até 2050, reabilitar e comprovar a aptidão ambiental e de segurança de 80% da superfície desativada selecionada como elegível a novos usos até 2030, respeitando as restrições específicas de cada área.","hz":"L"}]},{"cod":"2.4.3","oe":"Reduzir os riscos de contaminação do solo e das águas, dispersão de poeira, erosão e deslizamento de materiais associados aos depósitos de rejeitos, estéreis e demais resíduos.","metas":[{"code":"2.4.3.1","text":"Até 2040, assegurar que todos os depósitos classificados como de alto risco e 80% dos demais depósitos inventariados até 2030 atendam aos critérios técnicos de estabilidade, controle de poeira, erosão e contaminação.","hz":"M"}]},{"cod":"2.4.4","oe":"Ampliar o aproveitamento de rejeitos e resíduos da atividade de mineração de carvão de maneira segura.","metas":[{"code":"2.4.4.1","text":"Até 2040, destinar a usos tecnicamente e ambientalmente aprovados pelo menos 25% da massa de rejeitos e resíduos classificada como aproveitável no inventário concluído até 2030, com rastreabilidade da destinação.","hz":"M"}]}]},{"cod":"2.5","og":"Reduzir as emissões de gases de efeito estufa e de poluentes e promover práticas produtivas regenerativas e de baixo impacto ambiental","desc":"Considerar, na escolha de tecnologias, processos e novas atividades, o potencial de redução de emissões, o alinhamento às políticas climáticas e os impactos ambientais ao longo do ciclo de vida das alternativas propostas. Privilegiar, para os novos usos agropecuários, quando tecnicamente e ambientalmente admissíveis, a conservação do solo e da água, a diversificação produtiva, a recuperação das funções ecológicas, a redução de emissões e a remoção de CO₂ atmosférico. O aproveitamento de resíduos orgânicos e dejetos agropecuários para a produção de biometano considera a viabilidade técnica e ambiental, bem como a gestão adequada dos resíduos gerados no processo.","oes":[{"cod":"2.5.1","oe":"Reduzir a intensidade de emissões de GEE da base produtiva regional","metas":[{"code":"2.5.1.1","text":"Até 2050, alcançar, no conjunto das novas atividades apoiadas pela transição, intensidade de emissões de GEE por unidade de valor adicionado real pelo menos 50% inferior à das atividades de mineração de carvão e geração termelétrica, usando 2026/2027 como referência.","hz":"L"}]},{"cod":"2.5.2","oe":"Reduzir as emissões de poluentes atmosféricos das atividades abrangidas pela transição.","metas":[{"code":"2.5.2.1","text":"Até 2040, reduzir em pelo menos 50% as emissões anuais de cada poluente atmosférico prioritário das fontes abrangidas pela transição, em relação ao inventário de 2026/2027.","hz":"M"}]},{"cod":"2.5.3","oe":"Ampliar a adoção de práticas de conservação do solo e da água e de diversificação produtiva nas áreas aptas ao uso agropecuário.","metas":[{"code":"2.5.3.1","text":"Até 2040, implantar e manter práticas verificadas de conservação do solo e da água e diversificação produtiva em 75% da área agropecuária apoiada pelo plano, conforme protocolo técnico definido anteriormente (até 2030).","hz":"M"}]},{"cod":"2.5.4","oe":"Ampliar o aproveitamento ambientalmente adequado de resíduos orgânicos e dejetos para produção de biometano.","metas":[{"code":"2.5.4.1","text":"Até 2040, encaminhar à produção de biometano pelo menos 30% da massa anual de resíduos orgânicos e dejetos identificada como técnica e ambientalmente viável, com controle de vazamentos e destinação adequada.","hz":"M"}]}]},{"cod":"2.6","og":"Fortalecer a resiliência climática e a prevenção de emergências ambientais","desc":"Incorporar no planejamento das intervenções os riscos ambientais e climáticos e seus efeitos sobre a estabilidade das áreas recuperadas, os recursos hídricos e a mobilização de contaminantes, com medidas preventivas, protocolos de contingência e condições de manutenção dos benefícios ambientais no longo prazo.","oes":[{"cod":"2.6.1","oe":"Reduzir a vulnerabilidade das áreas em recuperação a chuvas intensas, inundações e estiagens.","metas":[{"code":"2.6.1.1","text":"Até 2040, reduzir em 50% a proporção das áreas em recuperação classificadas como de alto risco climático, em relação a 2026/2027, utilizando a mesma metodologia e cenários climáticos na comparação.","hz":"M"}]},{"cod":"2.6.2","oe":"Ampliar a capacidade de resposta a emergências ambientais nas áreas prioritárias.","metas":[{"code":"2.6.2.1","text":"Até 2030, assegurar que 30% das áreas prioritárias para prevenção de emergências tenham protocolos de resposta, responsáveis e meios de acionamento definidos, testados por pelo menos um simulado.","hz":"C"},{"code":"2.6.2.2","text":"Até 2040, assegurar que 100% das áreas prioritárias para prevenção de emergências tenham protocolos de resposta, responsáveis e meios de acionamento definidos.","hz":"M"}]}]},{"cod":"2.7","og":"Fortalecer a educação ambiental e a participação das comunidades","desc":"Promover a educação ambiental, a capacitação técnica e a participação das comunidades afetadas, que integram a definição e o acompanhamento das ações, com valorização do conhecimento local e atenção à distribuição equitativa dos benefícios ambientais da transição.","oes":[{"cod":"2.7.1","oe":"Ampliar a disseminação de conhecimentos sobre os riscos ambientais e a recuperação das áreas afetadas.","metas":[{"code":"2.7.1.1","text":"Até 2030, assegurar que 100% das comunidades diretamente afetadas identificadas pelo plano recebam pelo menos duas ações anuais de educação ambiental, com participação registrada e ganho de conhecimento verificado em 70% dos participantes avaliados.","hz":"C"}]},{"cod":"2.7.2","oe":"Ampliar a participação das comunidades nas decisões sobre as intervenções ambientais.","metas":[{"code":"2.7.2.1","text":"Até 2030, assegurar que 100% das novas intervenções ambientais contem com participação das comunidades afetadas na definição e no acompanhamento, com representação local, registro das contribuições e devolutiva sobre seu acolhimento.","hz":"C"}]}]}]},{"n":3,"titulo":"Eixo 3 - Desenvolvimento econômico territorial","ogs":[{"cod":"3.1","og":"Modernizar e fortalecer a base produtiva existente do Polo PETEJ-SC, visando promover uma economia de baixo carbono","desc":"Tornar a base produtiva existente com maiores níveis de sustentabilidade e competitividade, valorizando ativos produtivos regionais e preservando emprego e renda das famílias.","oes":[{"cod":"3.1.1","oe":"Ampliar o uso de biogás e biometano nas fábricas de cerâmica e metalmecânica do Polo PETEJ-SC, condicionado à disponibilidade de oferta e de infraestrutura de distribuição de biogás e biometano no Polo","metas":[{"code":"3.1.1.1","text":"Até 2030, selecionar uma amostra de fábricas de cerâmica e metalmecânica, para o projeto de troca de combustível por biogás ou biometano","hz":"C"},{"code":"3.1.1.2","text":"Até 2040, usar biogás ou biometano em 80% das fábricas de cerâmica e metalmecânica do Polo em pelo menos 25% da energia térmica dos processos produtivos (linha de base a apurar no diagnóstico energético do ano 1)","hz":"M"}]},{"cod":"3.1.3","oe":"Estimular novas atividades de negócio voltadas à coleta seletiva, tratamento e reaproveitamento (reciclagem) de resíduos e rejeitos do Polo PETEJ-SC, visando ampliar os empregos formais nesse setor","metas":[{"code":"3.1.3.1","text":"Até 2040, implantar ou ampliar a coleta seletiva em todos os municípios do Polo, com apoio do Estado (em 2024, 11 dos 43 municípios que responderam ao Sistema Nacional de Informações sobre Saneamento Básico, SINISA, informaram estar com coleta seletiva em operação)","hz":"M"},{"code":"3.1.3.2","text":"Reciclar pelo menos 20% dos resíduos sólidos urbanos domiciliares até 2030, e pelo menos 80% até 2040 (em 2024, foram 3.683 toneladas, o que corresponde a 1% das 358.267 toneladas de resíduos sólidos urbanos coletadas nos 43 municípios que informaram)","hz":"M"},{"code":"3.1.3.3","text":"Até 2030, cadastrar as empresas geradoras e das potenciais usuárias de rejeitos da mineração de carvão, de cinzas e de resíduos têxteis, madeireiros e urbanos do Polo concluído","hz":"C"},{"code":"3.1.3.4","text":"Até 2030, ter pelo menos 60% das empresas cadastradas na Meta 3.1.4.1 como geradoras ou potenciais usuárias de resíduos ou rejeitos da mineração de carvão atendidas em projetos de reaproveitamento","hz":"C"},{"code":"3.1.3.5","text":"Até 2030, ter pelo menos 3.200 empregos formais na coleta, tratamento e reciclagem de resíduos no Polo (em 2025, eram 2.432; em 2015, 949 nós 45 múnicipios das 3 associações)","hz":"C"}]},{"cod":"3.1.4","oe":"Dar novo uso produtivo às áreas mineradas recuperadas e aos sítios industriais desativados do Polo PETEJ-SC, condicionado à conclusão da recuperação ambiental das áreas (eixo ambiental) e à manutenção das obrigações legais dos responsáveis pela exploração","metas":[{"code":"3.1.4.1","text":"Até 2030, cadastrar as áreas mineradas recuperadas e dos sítios industriais desativados concluído","hz":"C"},{"code":"3.1.4.2","text":"Desenvolver novo uso produtivo para pelo menos 20% das áreas mineradas recuperadas e dos sítios industriais desativados cadastrados (Meta 3.1.4.1), até 2030, e 100% até 2040","hz":"M"}]},{"cod":"3.1.5","oe":"Dar novo uso produtivo a minas subterrâneas desativadas nos municípios mineradores do Polo PETEJ-SC","metas":[{"code":"3.1.5.1","text":"Até 2030, concluir os estudos de viabilidade econômica para o novo uso sustentável de minas subterrâneas desativadas","hz":"C"},{"code":"3.1.5.2","text":"Reaproveitar de pelo menos 5 minas subterrâneas desativadas, entre as consideradas viáveis nos estudos da Meta 3.1.5.1, até 2040, com a primeira em operação até 2030","hz":"M"}]},{"cod":"3.1.6","oe":"Fomentar o Potencial Turístico dos municípios e política de incentivo ao setor, visando promover a estruturação do Sistema Turístico Integrado do Sul catarinense","metas":[{"code":"3.1.6.1","text":"Desenvolver o Sistema Turistico Regional, integrando o turismo ecológico e sustentável nas serras e no litoral com os circuítos de turismo cultural e gastronômico, com foco específico na cultura da mineração de carvão e seus mais de 140 anos de história, visando aumentar o potencial de retenção de turistas nos municípios da região para uma média de 3 dias e de 25% o número de pessoas juridicas dedicadas à oferta de serviços turísticos, até 2030","hz":"C"},{"code":"3.1.6.2","text":"Até 2030, criar pelo menos 1.000 novos empregos formais nesse setor","hz":"C"}]},{"cod":"3.1.7","oe":"Aproximar o salário médio do emprego formal do Polo PETEJ-SC à média de Santa Catarina","metas":[{"code":"3.1.7.1","text":"Até 2030, definir mecanismos de apoio aos setores produtivos que apresentem crescimento real do salário médio, definidos e em operação","hz":"C"},{"code":"3.1.7.2","text":"Até 2030, salário médio do Polo atingir pelo menos 90% do valor de Santa Catarina (em 2025, correspondente a 84,9% da média salarial do Estado)","hz":"C"}]}]},{"cod":"3.2","og":"Atrair novas cadeias produtivas de maior complexidade","desc":"Atrair ao Polo PETEJ-SC investimentos em atividades de maior complexidade em novos setores com potencial de desenvolvimento, garantindo salvaguardas socioambientais.","oes":[{"cod":"3.2.1","oe":"Identificar setores de maior complexidade e com alto potencial de desenvolvimento no Polo, com foco na indústria de máquinas, eletroeletrônicos, materiais avançados e tecnologia da informação","metas":[{"code":"3.2.1.1","text":"Até 2030, realizar estudo sobre complexidade econômica e potencial de desenvolvimento setorial do Polo (a ser concluído até o fim do 2° ano do plano), com definição da métrica de complexidade a ser adotada e da lista de setores prioritários, validada com os atores regionais","hz":"C"}]},{"cod":"3.2.2","oe":"Promover a atração de investimentos nos setores de maior complexidade identificados","metas":[{"code":"3.2.2.1","text":"Até 2030, ter pelo menos 20 projetos de investimento com protocolo de intenções ou contrato de incentivo (PRODEC, Pró-Emprego ou TTD 489) assinado com o Estado por empresas das indústrias de máquinas, eletroeletrônicos, materiais avançados e de tecnologia da informação","hz":"C"},{"code":"3.2.2.2","text":"Desenvolver 2 projetos de investimento de indústria de alta complexidade, com protocolo de intenções assinado com o Estado, para instalação no Polo (total de 6 até 2030)","hz":"C"}]},{"cod":"3.2.3","oe":"Constituir um ambiente favorável ao empreendedorismo no Polo PETEJ-SC, que permita aumentar o número de empresas focadas na produção de bens e serviços inovadores e de alta complexidade, nos municípios do Polo PETEJ-SC","metas":[{"code":"3.2.3.1","text":"Até 2030, criar uma rede de inc
