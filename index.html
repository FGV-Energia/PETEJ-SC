    const om = metasOf.og(og);
    h += `<a class="card ogcard" href="#og-${og.cod}" style="--x:${ev(e.n)}"><span class="badge code">${og.cod}</span><h3>${esc(og.og)}</h3>
      <p>${esc(og.desc)}</p><div class="foot"><span><b>${plural(og.oes.length, "objetivo específico", "objetivos específicos")}</b> · <b>${plural(om.length, "meta", "metas")}</b></span>${hzBar(om)}</div></a>`;
  });
  h += `</div></section>` + footer();
  return h;
}
function pagePremissas(e) {
  let h = crumbs([["Início", "inicio"], [`Eixo ${e.n}`, `eixo-${e.n}`], ["Premissas"]]);
  h += `<div style="--x:${ev(e.n)}"><div class="eyebrow" style="color:var(--x)">Eixo ${e.n} · ${esc(e.info.short)}</div>
    <h1 style="font-size:clamp(24px,3vw,30px);margin:6px 0 6px">Premissas para a definição dos objetivos</h1>
    <p style="color:var(--muted);margin:0 0 20px;max-width:70ch">As premissas são as condições de contorno que orientaram a formulação dos objetivos gerais, objetivos específicos e metas deste eixo.</p>
    <ol class="prem">${e.a.premissas.map((p, i) => `<li class="card"><span class="badge">${i + 1}</span><h3>${esc(e.info.prem[i] || "")}</h3><p>${esc(p)}</p></li>`).join("")}</ol>
    <p class="note">Os títulos curtos de cada premissa são uma síntese editorial; o texto integral segue a planilha.</p>
    <div style="margin-top:22px"><a class="btn solid" style="--x:${ev(e.n)}" href="#og-${e.ogs[0].cod}">Ver objetivos gerais do eixo ${ico("right")}</a></div></div>`;
  return h + footer();
}
function metaCard(m, e) {
  return `<div class="meta" style="--h:${hv(m.hz)}">${m.code ? `<span class="code">${esc(m.code)}</span>` : ""}<p>${esc(m.text)}</p></div>`;
}
function pageOG(og) {
  const e = og.eixo, i = OG.indexOf(og), prev = OG[i - 1], next = OG[i + 1], om = metasOf.og(og);
  let h = crumbs([["Início", "inicio"], [`Eixo ${e.n}`, `eixo-${e.n}`], [`Objetivo geral ${og.cod}`]]);
  h += `<section class="ghead" style="--x:${ev(e.n)}"><div class="code-big code">${og.cod}</div>
    <div class="eyebrow">Objetivo geral · Eixo ${e.n} · ${esc(e.info.short)}</div><h1>${esc(og.og)}</h1><p>${esc(og.desc)}</p></section>`;
  h += `<section class="sec" style="--x:${ev(e.n)}"><div class="sec-h"><h2>${plural(og.oes.length, "objetivo específico", "objetivos específicos")} · ${plural(om.length, "meta", "metas")}</h2>${legend()}</div><div class="grid">`;
  og.oes.forEach(oe => {
    h += `<article class="card oe" id="${oe.cod}"><div class="oe-h"><span class="pill code">${oe.cod}</span><p>${esc(oe.oe)}</p><a href="#oe-${oe.cod}">Abrir ›</a></div><div class="hzcols">`;
    HZK.forEach(k => {
      const ms = oe.metas.filter(m => m.hz === k);
      h += `<div class="hzcol"><div class="hzlab"><i style="background:${hv(k)}"></i>${HZ[k].nome} <em>${HZ[k].ate}</em></div>${ms.length ? ms.map(m => metaCard(m, e)).join("") : `<div class="empty">Sem meta neste horizonte</div>`}</div>`;
    });
    h += `</div></article>`;
  });
  h += `</div></section>`;
  h += `<nav class="pager">${prev ? `<a class="card" href="#og-${prev.cod}">← Anterior<b>${prev.cod} · ${esc(prev.og)}</b></a>` : ""}${next ? `<a class="card next" href="#og-${next.cod}">Próximo →<b>${next.cod} · ${esc(next.og)}</b></a>` : ""}</nav>`;
  return h + footer();
}
function pageOE(oe) {
  const og = oe.og, e = oe.eixo, i = OE.indexOf(oe), prev = OE[i - 1], next = OE[i + 1];
  let h = crumbs([["Início", "inicio"], [`Eixo ${e.n}`, `eixo-${e.n}`], [`Objetivo geral ${og.cod}`, `og-${og.cod}`], [`Objetivo específico ${oe.cod}`]]);
  h += `<div style="--x:${ev(e.n)}"><div class="eyebrow" style="color:var(--x)">Objetivo específico ${oe.cod}</div>
    <h1 style="font-size:clamp(22px,2.8vw,30px);margin:8px 0 10px;max-width:40ch">${esc(oe.oe)}</h1>
    <p style="margin:0;color:var(--muted)">Vinculado ao objetivo geral <a href="#og-${og.cod}" style="color:var(--brand-2);font-weight:700;text-decoration:none">${og.cod} · ${esc(og.og)}</a></p>
    <section class="sec"><div class="sec-h"><h2>Metas por horizonte</h2>${legend()}</div><div class="tl">`;
  HZK.forEach(k => {
    const ms = oe.metas.filter(m => m.hz === k);
    h += `<div class="tl-step" style="--h:${hv(k)}"><div class="tl-when"><div class="yr">${HZ[k].ano}</div><span>${HZ[k].nome}</span></div>
      <div class="tl-body">${ms.length ? ms.map(m => metaCard(m, e)).join("") : `<div class="empty">Sem meta neste horizonte</div>`}</div></div>`;
  });
  h += `</div></section>`;
  h += `<section class="sec"><div class="sec-h"><h2 style="font-size:18px">Outros objetivos específicos do objetivo geral ${og.cod}</h2></div>
    <div class="siblings">${og.oes.map(o => `<a class="chip ${o === oe ? "on" : ""}" href="#oe-${o.cod}" title="${esc(o.oe)}"><i>${o.cod}</i>${plural(o.metas.length, "meta", "metas")}</a>`).join("")}</div></section></div>`;
  h += `<nav class="pager">${prev ? `<a class="card" href="#oe-${prev.cod}">← Anterior<b>${prev.cod}</b></a>` : ""}${next ? `<a class="card next" href="#oe-${next.cod}">Próximo →<b>${next.cod}</b></a>` : ""}</nav>`;
  return h + footer();
}
function norm(s) { return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
function pageMetas() {
  let h = crumbs([["Início", "inicio"], ["Metas por horizonte"]]);
  h += `<h1 style="font-size:clamp(24px,3vw,30px);margin-bottom:6px">Metas por horizonte de prazo</h1>
    <p style="color:var(--muted);margin:0 0 18px;max-width:70ch">Curto prazo reúne as metas com prazo até 2030; médio prazo, até 2040; longo prazo, até 2050. Filtre por horizonte, eixo ou palavra.</p>
    <div class="card filters">
      <div class="seg" id="segHz" aria-label="Horizonte">
        <button type="button" data-hz="all" aria-pressed="${state.hz === "all"}">Todas <em>${META.length}</em></button>
        ${HZK.map(k => `<button type="button" data-hz="${k}" aria-pressed="${state.hz === k}"><i style="background:${hv(k)}"></i>${HZ[k].nome} <em>${META.filter(m => m.hz === k).length}</em></button>`).join("")}
      </div>
      <div class="seg" id="segEixo" aria-label="Eixo">
        <button type="button" data-eixo="0" aria-pressed="${state.eixo === 0}">Todos os eixos</button>
        ${EIXOS.map(e => `<button type="button" data-eixo="${e.n}" aria-pressed="${state.eixo === e.n}"><i style="background:${ev(e.n)}"></i>${e.n}. ${esc(e.info.short)}</button>`).join("")}
      </div>
      <label class="sr" for="qMetas">Filtrar metas por palavra</label>
      <input id="qMetas" type="search" placeholder="Filtrar metas por palavra (ex.: biometano, 2035, mulheres)" value="${esc(state.q)}">
    </div><div id="mlist"></div>`;
  return h + footer();
}
function renderMetaList() {
  const q = norm(state.q);
  const list = META.filter(m => (state.hz === "all" || m.hz === state.hz) && (!state.eixo || m.oe.eixo.n === state.eixo) && (!q || norm(m.text + " " + (m.code || "") + " " + m.oe.oe).includes(q)));
  let h = `<p class="count">${plural(list.length, "meta encontrada", "metas encontradas")}</p>`;
  EIXOS.forEach(e => {
    const ms = list.filter(m => m.oe.eixo === e);
    if (!ms.length) return;
    h += `<section class="mgroup" style="--x:${ev(e.n)}"><h3><span class="badge">${ico("e" + e.n)}</span>Eixo ${e.n} · ${esc(e.info.short)} <span style="font:400 14px var(--f-body);color:var(--muted)">${ms.length}</span></h3><div class="card">`;
    ms.forEach(m => {
      h += `<div class="mrow" style="--h:${hv(m.hz)}"><span class="pill"><i></i>${HZ[m.hz].nome}</span><div class="txt">${m.code ? `<b class="code">${esc(m.code)}</b>` : ""}${esc(m.text)}</div>
        <div class="ref">Objetivo específico <a href="#oe-${m.oe.cod}">${m.oe.cod}</a> · ${esc(m.oe.oe)}</div></div>`;
    });
    h += `</div></section>`;
  });
  if (!list.length) h += `<div class="card" style="padding:18px;color:var(--muted)">Nenhuma meta corresponde aos filtros. Limpe a busca ou escolha outro horizonte.</div>`;
  $("#mlist").innerHTML = h;
}

// ---------- router ----------
function route() {
  const r = (location.hash || "#inicio").slice(1) || "inicio";
  state.route = r;
  let m, html;
  if ((m = r.match(/^eixo-(\d)$/)) && EIXOS.find(e => e.n === +m[1])) html = pageEixo(EIXOS.find(e => e.n === +m[1]));
  else if ((m = r.match(/^premissas-(\d)$/)) && EIXOS.find(e => e.n === +m[1])) html = pagePremissas(EIXOS.find(e => e.n === +m[1]));
  else if (r.startsWith("og-") && byId.og[r.slice(3)]) html = pageOG(byId.og[r.slice(3)]);
  else if (r.startsWith("oe-") && byId.oe[r.slice(3)]) html = pageOE(byId.oe[r.slice(3)]);
  else if (r === "metas" || r.startsWith("metas-")) {
    const tok = r.split("-")[1];
    const k = HZK.find(x => HZ[x].tok === tok);
    if (tok) state.hz = k || "all";
    html = pageMetas();
  } else { state.route = "inicio"; html = pageHome(); }
  $("#main").innerHTML = html;
  hydrateIcons($("#main"));
  if (state.route.startsWith("metas")) { bindMetas(); renderMetaList(); }
  renderSide(); hydrateIcons($("#side"));
  document.body.classList.remove("nav-open");
  $("#menuBtn").setAttribute("aria-expanded", "false");
  window.scrollTo(0, 0);
  const t = $("#main h1"); document.title = "PETEJ-SC Quadro Estratégico";
}
function bindMetas() {
  $("#segHz").addEventListener("click", ev2 => { const b = ev2.target.closest("button"); if (!b) return; state.hz = b.dataset.hz; $("#segHz").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); renderMetaList(); });
  $("#segEixo").addEventListener("click", ev2 => { const b = ev2.target.closest("button"); if (!b) return; state.eixo = +b.dataset.eixo; $("#segEixo").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); renderMetaList(); });
  $("#qMetas").addEventListener("input", ev2 => { state.q = ev2.target.value; renderMetaList(); });
}
function hydrateIcons(root) { root.querySelectorAll(".ico[data-i]").forEach(el => { el.innerHTML = ICONS[el.dataset.i] || ""; el.removeAttribute("data-i"); }); }

// Reclicking the active axis collapses or reopens its submenu without changing page.
document.addEventListener("click", ev2 => {
  const a = ev2.target.closest('#side > a[href^="#eixo-"]');
  if (!a) return;
  const n = Number(a.getAttribute("href").slice(6));
  if (state.route === `eixo-${n}`) {
    ev2.preventDefault();
    state.expandedEixo = state.expandedEixo === n ? 0 : n;
    renderSide(); hydrateIcons($("#side"));
  }
});

// links that preset filters (eixo) before routing
document.addEventListener("click", ev2 => {
  const a = ev2.target.closest("a[data-eixo]");
  if (a) { state.eixo = +a.dataset.eixo; if (a.getAttribute("href") === "#metas") state.hz = "all"; state.q = ""; if (location.hash === a.getAttribute("href")) { ev2.preventDefault(); route(); } }
  else if (ev2.target.closest('a[href^="#metas"]')) { state.eixo = 0; state.q = ""; if (ev2.target.closest('a[href="#metas"]')) state.hz = "all"; }
});

// ---------- global search ----------
const IDX = [];
EIXOS.forEach(e => e.a.premissas.forEach((p, i) => IDX.push({ g: "Premissas", t: `Eixo ${e.n} · ${e.info.prem[i] || ""}`, s: p, href: `premissas-${e.n}` })));
OG.forEach(o => IDX.push({ g: "Objetivos gerais", t: `${o.cod} · ${o.og}`, s: o.og + " " + o.desc, href: `og-${o.cod}` }));
OE.forEach(o => IDX.push({ g: "Objetivos específicos", t: `${o.cod} · ${o.oe}`, s: o.oe, href: `oe-${o.cod}` }));
META.forEach(m => IDX.push({ g: "Metas", t: `${m.code ? m.code + " · " : ""}${m.text}`, s: m.text + " " + (m.code || ""), href: `oe-${m.oe.cod}` }));
IDX.forEach(x => x.n = norm(x.s + " " + x.t));
function hl(text, q) {
  const n = norm(text), i = n.indexOf(q);
  if (i < 0) return esc(text.length > 150 ? text.slice(0, 150) + "…" : text);
  const st = Math.max(0, i - 50), en = Math.min(text.length, i + q.length + 90);
  return (st ? "…" : "") + esc(text.slice(st, i)) + "<mark>" + esc(text.slice(i, i + q.length)) + "</mark>" + esc(text.slice(i + q.length, en)) + (en < text.length ? "…" : "");
}
$("#q").addEventListener("input", () => {
  const q = norm($("#q").value.trim()), box = $("#results");
  if (q.length < 2) { box.hidden = true; return; }
  const hits = IDX.filter(x => x.n.includes(q));
  const groups = ["Objetivos gerais", "Objetivos específicos", "Metas", "Premissas"];
  let h = "";
  groups.forEach(g => { const gh = hits.filter(x => x.g === g); if (!gh.length) return; h += `<h4>${g} · ${gh.length}</h4>` + gh.slice(0, 6).map(x => `<a href="#${x.href}">${hl(x.t, q)}</a>`).join(""); });
  box.innerHTML = h || `<div class="none">Nada encontrado para “${esc($("#q").value)}”.</div>`;
  box.hidden = false;
});
$("#results").addEventListener("click", ev2 => { if (ev2.target.closest("a")) { $("#results").hidden = true; $("#q").value = ""; } });
document.addEventListener("click", ev2 => { if (!ev2.target.closest(".search")) $("#results").hidden = true; });
$("#q").addEventListener("keydown", ev2 => { if (ev2.key === "Escape") { $("#results").hidden = true; $("#q").blur(); } });

// ---------- mobile nav ----------
$("#menuBtn").addEventListener("click", () => { const o = document.body.classList.toggle("nav-open"); $("#menuBtn").setAttribute("aria-expanded", o); });
$("#scrim").addEventListener("click", () => { document.body.classList.remove("nav-open"); $("#menuBtn").setAttribute("aria-expanded", "false"); });

hydrateIcons(document);
window.addEventListener("hashchange", route);
route();
</script>

</body></html>
